    <style>
        :root {
            --primary-metallic: #2c1a1d; /* Deep Burgundy Theme */
            --royal-gold: #e8b4b8;       /* Rose Gold Accent */
            --bg-canvas: #fdfcfc;
            --text-dark: #231b1c;
            --text-muted: #7d7274;
            --white: #ffffff;
            --font-display: 'Cinzel', serif;
            --font-sans: 'Inter', sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-canvas); color: var(--text-dark); font-family: var(--font-sans); display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        
        header { background-color: rgba(44, 26, 29, 0.95); backdrop-filter: blur(15px); color: var(--white); padding: 20px 5%; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(232, 180, 184, 0.2); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; width: 100%; }
        .logo { font-family: var(--font-display); font-size: 25px; font-weight: 500; letter-spacing: 2px; color: var(--white); text-decoration: none; }
        .logo span { color: var(--royal-gold); font-weight: 700; }
        
        .search-container { position: relative; display: flex; align-items: center; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(232, 180, 184, 0.2); padding: 8px 16px; width: 260px; transition: all 0.4s ease; }
        .search-container:focus-within { border-color: var(--royal-gold); width: 310px; }
        .search-input { background: transparent; border: none; color: var(--white); outline: none; font-size: 13px; width: 100%; }
        .search-container i { color: var(--royal-gold); font-size: 13px; margin-left: 8px; }

        .page-title-bar { background: linear-gradient(rgba(44, 26, 29, 0.6), rgba(35, 27, 28, 0.8)), url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1400&q=80') no-repeat center 30%/cover; color: var(--white); text-align: center; padding: 130px 20px; border-bottom: 2px solid var(--royal-gold); }
        .page-title-bar h1 { font-family: var(--font-display); font-size: 44px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 12px; }
        .page-title-bar p { font-size: 13px; color: var(--royal-gold); letter-spacing: 3px; font-weight: 400; text-transform: uppercase; }

        main { flex: 1; max-width: 1400px; width: 100%; margin: 70px auto; padding: 0 40px; }
        
        /* --- PREMIUM LUXURY PRODUCT CARD STYLES --- */
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); 
            gap: 40px 30px; 
        }

        .product-card { 
            background-color: var(--white); 
            overflow: hidden; 
            border-radius: 4px; 
            box-shadow: 0 10px 30px rgba(44, 26, 29, 0.02); 
            border: 1px solid rgba(44, 26, 29, 0.05); 
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            display: flex; 
            flex-direction: column; 
            position: relative; 
        }

        .product-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 20px 40px rgba(44, 26, 29, 0.08); 
            border-color: var(--royal-gold); 
        }

        .product-img-container { 
            width: 100%; 
            height: 400px; 
            overflow: hidden; 
            background-color: #f7f7f7; 
            position: relative; 
        }

        .product-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.5s ease;
            filter: brightness(0.98) contrast(1.02); 
        }

        .product-card:hover .product-img { 
            transform: scale(1.06); 
            filter: brightness(0.9); 
        }

        /* Image Gradient Overlay on Hover */
        .product-img-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 60%, rgba(44, 26, 29, 0.4));
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        
        .product-card:hover .product-img-container::after {
            opacity: 1;
        }

        /* --- ACCENT CART BUTTON ON IMAGE --- */
        .add-to-cart-btn { 
            background-color: var(--primary-metallic); 
            color: var(--white); 
            border: 1px solid var(--primary-metallic); 
            text-decoration: none; 
            padding: 14px 22px; 
            font-size: 11px; 
            font-weight: 600; 
            text-align: center; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.4s ease; 
        }

        @media (min-width: 769px) {
            .product-card .add-to-cart-btn { 
                position: absolute; 
                bottom: -20px; 
                left: 20px; 
                right: 20px; 
                opacity: 0; 
                z-index: 5; 
            }
            .product-card:hover .add-to-cart-btn { 
                bottom: 20px; 
                opacity: 1; 
            }
        }

        .add-to-cart-btn:hover { 
            background-color: var(--white); 
            color: var(--primary-metallic); 
            border-color: var(--white); 
            transform: scale(1.02);
        }

        .product-info { 
            padding: 20px 15px 15px 15px; 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1; 
            background: var(--white); 
        }

        .product-title { 
            font-family: var(--font-display); 
            font-size: 16px; 
            font-weight: 600; 
            margin-bottom: 6px; 
            color: var(--text-dark); 
            letter-spacing: 0.5px;
        }

        .product-desc { 
            font-size: 12.5px; 
            color: var(--text-muted); 
            margin-bottom: 15px; 
            line-height: 1.5; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: auto; 
            border-top: 1px solid #f5f5f3; 
            padding-top: 12px; 
        }

        .product-price { 
            font-size: 17px; 
            font-weight: 700; 
            color: var(--primary-metallic); 
        }
        
        .empty-state { text-align: center; grid-column: 1 / -1; padding: 90px 20px; }
        .empty-state p { font-family: var(--font-display); font-size: 20px; color: var(--text-muted); }
        
        footer { background-color: var(--primary-metallic); color: #9c9193; padding: 60px 5% 40px 5%; margin-top: auto; border-top: 3px solid var(--royal-gold); }
        .copyright { text-align: center; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            header { padding: 15px 4%; }
            .search-container { width: 140px; }
            .logo { font-size: 20px; }
            .page-title-bar { padding: 80px 15px; }
            .page-title-bar h1 { font-size: 28px; }
            main { margin: 35px auto; padding: 0 15px; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .product-img-container { height: 260px; } 
            .product-info { padding: 12px 10px; }
            .product-title { font-size: 14px; }
            .product-price { font-size: 15px; }
            .product-price-row { flex-direction: column; align-items: flex-start; gap: 10px; }
            .add-to-cart-btn { width: 100%; padding: 10px; font-size: 10px; border-radius: 4px; }
        }
    </style>
</head>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKVwHm3-RO3IkycB8VdwizUYQLgasGqzk",
            authDomain: "lucky-triode-450317-g7.firebaseapp.com",
            databaseURL: "https://lucky-triode-450317-g7-default-rtdb.firebaseio.com/", 
            projectId: "lucky-triode-450317-g7",
            storageBucket: "lucky-triode-450317-g7.firebasestorage.app",
            messagingSenderId: "778199870672",
            appId: "1:778199870672:web:62a9891e41b3a3d3f242d5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let womenswearProducts = [];

        // Realtime Database Sync
        function syncCloudStore() {
            database.ref('products/womenswear').on('value', (snapshot) => {
                womenswearProducts = [];
                const cloudData = snapshot.val();
                
                if (cloudData) {
                    Object.keys(cloudData).forEach(key => {
                        womenswearProducts.push(cloudData[key]);
                    });
                }
                renderProducts(womenswearProducts);
            });
        }

        function renderProducts(productsList) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            if (productsList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-female" style="font-size:26px; color:#e8b4b8; display:block; margin-bottom:15px; opacity: 0.7;"></i>
                        <p>The collection is being updated. New styles arriving soon.</p>
                    </div>`;
                return;
            }

            productsList.forEach((product) => {
                const cardHTML = `
                    <article class="product-card">
                        <div class="product-img-container">
                            <img src="${product.imageUrl || ''}" alt="${product.title || ''}" class="product-img" loading="lazy">
                            <a href="${product.buyLink || '#'}" target="_blank" rel="noopener" class="add-to-cart-btn d-hide-mobile">
                                <i class="fas fa-shopping-bag"></i> Acquire Style
                            </a>
                        </div>
                        <div class="product-info">
                            <h2 class="product-title">${product.title || ''}</h2>
                            <p class="product-desc">${product.description || ''}</p>
                            <div class="product-price-row">
                                <span class="product-price">₹${product.price}</span>
                                <a href="${product.buyLink || '#'}" target="_blank" rel="noopener" class="add-to-cart-btn d-show-mobile" style="display: none;">
                                    Acquire
                                </a>
                            </div>
                        </div>
                    </article>
                `;
                container.innerHTML += cardHTML;
            });

            syncLayoutBreakpoints();
        }

        function syncLayoutBreakpoints() {
            const mobileStatus = window.innerWidth <= 768;
            document.querySelectorAll('.d-show-mobile').forEach(btn => {
                btn.style.display = mobileStatus ? 'flex' : 'none';
            });
            document.querySelectorAll('.d-hide-mobile').forEach(btn => {
                btn.style.display = mobileStatus ? 'none' : 'flex';
            });
        }

        // Live Search Filtering
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const queryToken = e.target.value.toLowerCase().trim();
            const filteredArray = womenswearProducts.filter(product => {
                const title = product.title || '';
                const desc = product.description || '';
                return title.toLowerCase().includes(queryToken) || desc.toLowerCase().includes(queryToken);
            });
            renderProducts(filteredArray);
        });

        window.addEventListener('resize', syncLayoutBreakpoints);
        window.addEventListener('DOMContentLoaded', syncCloudStore);
    </script>
