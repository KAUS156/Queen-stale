<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Premium Women's Wear Collection | Shop Luxury Fashion - StyleEasy</title>
    <meta name="description" content="Explore StyleEasy's exclusive Women's wear premium collection. Shop custom elegant dresses, modern luxury shirts, and sophisticated casuals crafted for ultimate comfort.">
    <meta name="keywords" content="women fashion, premium womens wear, stylish outfits, luxury clothing, styleeasy women, buy womens clothes online">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.styleeasy.com/womenswear.html">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.styleeasy.com/womenswear.html">
    <meta property="og:title" content="Premium Women's Wear Collection | StyleEasy">
    <meta property="og:description" content="Shop the latest trends in luxury women's fashion. High-quality fabric and perfect fit guaranteed at StyleEasy.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=600&q=80">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.styleeasy.com/womenswear.html">
    <meta name="twitter:title" content="Premium Women's Wear Collection | StyleEasy">
    <meta name="twitter:description" content="Shop premium quality women's apparel. Redefine your style today.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=600&q=80">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Women's Luxury Collection - StyleEasy",
      "description": "Explore premium Women's wear collection including casuals, formals, and haute couture.",
      "url": "https://www.styleeasy.com/womenswear.html",
      "publisher": {
        "@type": "Organization",
        "name": "StyleEasy",
        "logo": "https://www.styleeasy.com/logo.png"
      }
    }
    </script>

    <style>
        /* === PREMIUM MINIMAL LUXURY THEME VARIABLES === */
        :root {
            --primary-color: #0d0d0d;       /* अल्ट्रा रिच ब्लैक */
            --accent-color: #ba996c;        /* शैम्पेन गोल्ड */
            --text-muted: #666666;
            --light-bg: #fbfbf9;            /* सॉफ्ट ऑफ-व्हाइट बैकग्राउंड */
            --white: #ffffff;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--light-bg); color: var(--primary-color); font-family: var(--font-body); display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        
        /* MODERN GLASSMORPHIC HEADER */
        header { background-color: rgba(13, 13, 13, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--white); padding: 18px 5%; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1300px; margin: 0 auto; width: 100%; }
        .logo { font-family: var(--font-heading); font-size: 26px; font-weight: 600; letter-spacing: 1.5px; color: var(--white); text-decoration: none; }
        .logo span { color: var(--accent-color); font-style: italic; font-weight: 400; }
        
        /* APPLE-STYLE SEARCH BAR */
        .search-container { position: relative; display: flex; align-items: center; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; padding: 7px 18px; width: 280px; transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .search-container:focus-within { border-color: var(--accent-color); background: rgba(255, 255, 255, 0.15); width: 320px; }
        .search-input { background: transparent; border: none; color: var(--white); outline: none; font-size: 13.5px; width: 100%; font-family: var(--font-body); }
        .search-input::placeholder { color: #888; }
        .search-container i { color: #aaa; font-size: 14px; cursor: pointer; margin-left: 8px; }

        /* MINIMALIST HERO BANNER */
        .page-title-bar { background: linear-gradient(rgba(13,13,13,0.45), rgba(13,13,13,0.45)), url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1400&q=80') no-repeat center 35%/cover; color: var(--white); text-align: center; padding: 120px 20px; }
        .page-title-bar h1 { font-family: var(--font-heading); font-size: 46px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
        .page-title-bar p { font-size: 15px; color: #e5e5e5; letter-spacing: 2px; font-weight: 300; text-transform: uppercase; }

        /* MAIN CONTENT & GRID */
        main { flex: 1; max-width: 1300px; width: 100%; margin: 60px auto; padding: 0 30px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px 30px; }
        
        /* HIGH-END INTERACTIVE PRODUCT CARD */
        .product-card { background-color: var(--white); border-radius: 0px; overflow: hidden; box-shadow: var(--card-shadow); transition: all 0.4s ease; display: flex; flex-direction: column; position: relative; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        
        .product-img-container { width: 100%; height: 400px; overflow: hidden; background-color: #f7f7f7; position: relative; }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        
        /* HOVER INTERACTION FOR BUTTON IN DESKTOP */
        @media (min-width: 769px) {
            .product-card .add-to-cart-btn {
                position: absolute;
                bottom: -60px;
                left: 20px;
                right: 20px;
                opacity: 0;
                z-index: 5;
                transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            .product-card:hover .add-to-cart-btn {
                bottom: 20px;
                opacity: 1;
            }
            .product-card:hover .product-img {
                transform: scale(1.05);
                filter: brightness(0.9);
            }
        }
        
        /* PRODUCT INFO PANELS */
        .product-info { padding: 20px 5px; display: flex; flex-direction: column; flex-grow: 1; background: var(--white); }
        .product-title { font-family: var(--font-heading); font-size: 19px; font-weight: 400; margin-bottom: 6px; color: var(--primary-color); line-height: 1.4; text-transform: capitalize; }
        .product-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; line-height: 1.6; font-weight: 300; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .product-price { font-size: 18px; font-weight: 500; color: var(--primary-color); letter-spacing: 0.5px; }
        
        /* LUXURY ACTION BUTTON */
        .add-to-cart-btn { background-color: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); text-decoration: none; padding: 12px 20px; border-radius: 0px; font-size: 12px; font-weight: 500; text-align: center; letter-spacing: 1.5px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s ease; }
        .add-to-cart-btn:hover { background-color: var(--primary-color); color: var(--white); }
        
        .empty-state { text-align: center; grid-column: 1 / -1; padding: 80px 20px; color: var(--text-muted); }
        .empty-state p { font-family: var(--font-heading); font-size: 20px; font-style: italic; }
        
        /* MATTE BLACK FOOTER */
        footer { background-color: var(--primary-color); color: #888888; padding: 60px 5% 40px 5%; margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05); }
        .footer-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 40px; max-width: 1300px; margin: 0 auto; }
        .footer-box h3 { font-family: var(--font-heading); color: var(--white); font-size: 20px; margin-bottom: 20px; font-weight: 400; letter-spacing: 1px; }
        .footer-box p { font-size: 13.5px; line-height: 1.8; font-weight: 300; }
        .copyright { text-align: center; margin-top: 50px; padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }

        /* === PREMIUM MOBILE VIEWS ADJUSTMENTS === */
        @media (max-width: 768px) {
            header { padding: 14px 4%; }
            .search-container { width: 150px; padding: 5px 10px; }
            .search-container:focus-within { width: 180px; }
            .logo { font-size: 22px; }
            
            .page-title-bar { padding: 70px 15px; }
            .page-title-bar h1 { font-size: 30px; letter-spacing: 2px; }
            .page-title-bar p { font-size: 12px; }

            main { margin: 30px auto; padding: 0 15px; }
            /* 2-Column Luxury Grid Configuration */
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 25px 15px; }
            
            .product-img-container { height: 260px; } 
            .product-info { padding: 12px 0px; }
            .product-title { font-size: 15px; }
            .product-desc { font-size: 12px; margin-bottom: 10px; -webkit-line-clamp: 1; }
            .product-price-row { flex-direction: column; align-items: flex-start; gap: 12px; }
            .product-price { font-size: 15px; font-weight: 600; }
            .add-to-cart-btn { width: 100%; padding: 10px; font-size: 11px; letter-spacing: 1px; }
        }

        @media (max-width: 380px) {
            .products-grid { grid-template-columns: 1fr; gap: 30px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo" aria-label="StyleEasy Homepage">Style<span>Easy</span></a>
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search the collection..." aria-label="Search items">
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>
        </div>
    </header>

    <section class="page-title-bar">
        <h1>Women's Collection</h1>
        <p>A Study in Modern Elegance</p>
    </section>

    <main>
        <div class="products-grid" id="productsContainer" aria-live="polite"></div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-box">
                <h3>The Studio</h3>
                <p>StyleEasy curates high-end luxury silhouettes for women. Our garments are architectural expressions designed using premium local craftsmanship.</p>
            </div>
        </div>
        <div class="copyright">&copy; 2026 StyleEasy Studio. Crafted for Excellence.</div>
    </footer>

    <script>
        let womenProducts = [];

        function loadWomenStore() {
            try {
                const allProducts = JSON.parse(localStorage.getItem('styleEasyIsolatedProducts')) || [];
                // Only pull elements flagged under 'women' target category
                womenProducts = allProducts.filter(item => item.category === 'women');
                renderProducts(womenProducts);
            } catch (error) {
                console.error("Critical database runtime error:", error);
            }
        }

        function renderProducts(productsList) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            if (productsList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-dot-circle" style="font-size:24px; color:#ba996c; display:block; margin-bottom:15px;"></i>
                        <p>The collection is currently being curated. Please check back shortly.</p>
                    </div>`;
                return;
            }

            productsList.forEach((product) => {
                const targetLink = product.buyLink || '#';
                const title = product.title || 'Premium Silhouette';
                const desc = product.description || 'Finest luxury construction featuring curated detailing.';
                const price = product.price || '0';
                const img = product.imageUrl || 'https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=400&q=80';

                const cardHTML = `
                    <article class="product-card">
                        <div class="product-img-container">
                            <img src="${img}" alt="Purchase ${title} Premium Wear" class="product-img" loading="lazy">
                            <a href="${targetLink}" target="_blank" rel="noopener" class="add-to-cart-btn to-hide-mobile">
                                <i class="fas fa-shopping-bag"></i> Discover Piece
                            </a>
                        </div>
                        <div class="product-info">
                            <h2 class="product-title">${title}</h2>
                            <p class="product-desc">${desc}</p>
                            <div class="product-price-row">
                                <span class="product-price">₹${price}</span>
                                <a href="${targetLink}" target="_blank" rel="noopener" class="add-to-cart-btn to-show-mobile" style="display: none;">
                                    Buy Now
                                </a>
                            </div>
                        </div>
                    </article>
                `;
                container.innerHTML += cardHTML;
            });

            adjustMobileButtons();
        }

        // Setup clean logic breakpoints for view layouts dynamically
        function adjustMobileButtons() {
            const isMobile = window.innerWidth <= 768;
            document.querySelectorAll('.to-show-mobile').forEach(btn => {
                btn.style.display = isMobile ? 'flex' : 'none';
            });
        }

        // Live Event Pipeline for Search Inputs
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            const filteredProducts = womenProducts.filter(product => {
                const titleMatch = product.title ? product.title.toLowerCase().includes(searchTerm) : false;
                const descMatch = product.description ? product.description.toLowerCase().includes(searchTerm) : false;
                return titleMatch || descMatch;
            });

            renderProducts(filteredProducts);
        });

        window.addEventListener('resize', adjustMobileButtons);
        window.addEventListener('DOMContentLoaded', loadWomenStore);
    </script>
</body>
</html>
