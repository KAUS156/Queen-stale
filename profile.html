<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Ultra SEO Optimization -->
    <title>Queen Style Premium - Trending Clothing & Cosmetics Online</title>
    <meta name="description" content="Queen Style par sabse saste aur best offers me trending kapde, premium shirts, pants, cosmetics aur lipsticks online kharidein.">
    <meta name="keywords" content="Queen Style, online boutique, premium shirts, trendy pants, lipstick cosmetics, electronic fans, festive wear offers">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://superlative-haupia-d1b3ec.netlify.app/index.html">

    <!-- Open Graph / Meta Social tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://superlative-haupia-d1b3ec.netlify.app/">
    <meta property="og:title" content="Queen Style Premium - Exclusive Shop & Offers">
    <meta property="og:description" content="Trending outfits aur high-quality cosmetics par payein sabse behtar deals.">
    <meta property="og:image" content="https://superlative-haupia-d1b3ec.netlify.app/images.jpg">

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #0f172a;
            --brand-color: #1e3a8a;
            --accent: #ffa41c;
            --accent-gradient: linear-gradient(135deg, #ffa41c, #ff6b00);
            --pink-gradient: linear-gradient(135deg, #ec4899, #be185d);
            --bg-body: #f8fafc;
            --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px -5px rgba(0, 0, 0, 0.03);
            --card-hover-shadow: 0 20px 40px -5px rgba(30, 58, 138, 0.12), 0 8px 16px -5px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-body);
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }

        /* Luxury Top Navigation bar */
        .navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1100;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .navbar h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #ffffff, #fcd34d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 0.55rem 1.1rem;
            border-radius: 30px;
            color: #fca5a5;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* User Profile Premium Widget */
        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 1.5rem;
            border: 1px solid rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }

        .profile-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(30,58,138,0.03) 0%, transparent 70%);
            border-radius: 50%;
        }

        .profile-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .profile-info h3 {
            font-size: 1.2rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-info p {
            color: #64748b;
            font-size: 0.88rem;
            margin-top: 3px;
        }

        .google-badge {
            background: linear-gradient(135deg, #4285F4, #34a853);
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Sticky Search & Filter Station */
        .controls-station {
            position: sticky;
            top: 75px;
            z-index: 1000;
            background: rgba(248, 250, 252, 0.9);
            backdrop-filter: blur(12px);
            padding: 10px 0 15px 0;
            margin-bottom: 1.5rem;
        }

        .search-box-wrapper {
            position: relative;
            margin-bottom: 1rem;
            box-shadow: var(--card-shadow);
            border-radius: 14px;
        }

        .search-input {
            width: 100%;
            padding: 1.05rem 1.2rem 1.05rem 3.2rem;
            border: 1px solid rgba(0,0,0,0.06);
            background: white;
            border-radius: 14px;
            font-size: 1rem;
            font-family: inherit;
            color: #0f172a;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--brand-color);
            box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            opacity: 0.6;
        }

        /* Premium Scrollable Horizontal Tabs System */
        .filter-scroller {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 2px 0;
        }
        
        .filter-scroller::-webkit-scrollbar { display: none; }

        .tab-pill {
            background: white;
            color: #475569;
            padding: 0.65rem 1.3rem;
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .tab-pill.active {
            background: var(--brand-color);
            color: white;
            border-color: var(--brand-color);
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
        }
        
        .tab-pill:not(.active):hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        /* Typography Heading Section */
        h2.section-heading {
            font-family: 'Playfair Display', serif;
            font-size: 1.65rem;
            font-weight: 700;
            margin: 1.5rem 0;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Ultra Responsive Fluid Product Grid Layout */
        .product-showroom {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 1.75rem;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.01);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--card-hover-shadow);
        }

        /* Premium Floating Badges */
        .badge-ribbon {
            position: absolute;
            top: 14px;
            left: 14px;
            background: var(--pink-gradient);
            color: white;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 30px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(236, 72, 153, 0.3);
            letter-spacing: 0.5px;
        }

        .img-container {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: #fafafa;
            position: relative;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .product-card:hover img {
            transform: scale(1.06);
        }

        .card-details {
            padding: 1.35rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-details h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.8rem; /* Keeps layout matching perfectly even if titles are of different lengths */
        }

        .stars-row {
            color: #f59e0b;
            margin-bottom: 10px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .pricing-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
        }

        .price-tag {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--brand-color);
        }

        .mrp-tag {
            text-decoration: line-through;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .description-paragraph {
            font-size: 0.85rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 1.25rem;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .action-button {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent-gradient);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255, 164, 28, 0.2);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 164, 28, 0.35);
        }

        /* Beautiful Skeleton Shimmer Effect Component Layout */
        .skeleton-card {
            background: white;
            border-radius: 20px;
            height: 420px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .skeleton-block {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite linear;
            border-radius: 10px;
        }
        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Fluid Layout Adaptability Rules */
        @media (max-width: 768px) {
            .navbar { padding: 1rem; }
            .navbar h1 { font-size: 1.35rem; }
            .main-container { padding: 0.85rem; }
            .profile-card { flex-direction: column; text-align: center; padding: 1.25rem; }
            .controls-station { top: 65px; padding-bottom: 10px; }
            /* Smart Double Column View on standard smartphone profiles */
            .product-showroom { 
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
                gap: 0.95rem; 
            }
            .product-card { border-radius: 14px; }
            .img-container { height: 170px; }
            .card-details { padding: 0.9rem; }
            .card-details h3 { font-size: 0.92rem; height: 2.5rem; -webkit-line-clamp: 2; margin-bottom: 4px; }
            .price-tag { font-size: 1.1rem; }
            .description-paragraph { display: none; } /* Clear out noise to enhance smartphone grid views */
            .action-button { padding: 0.65rem; font-size: 0.85rem; border-radius: 8px; }
            .badge-ribbon { font-size: 9px; padding: 3px 8px; top: 8px; left: 8px; }
        }
    </style>
</head>
<body>

    <!-- Premium Navigation Navbar -->
    <div class="navbar">
        <h1>👑 Queen Style Premium</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main-container">
        <!-- Profile Widget -->
        <div class="profile-card" id="profileCard"></div>

        <!-- Sticky Controlling Engine (Search + Filter Badges) -->
        <div class="controls-station">
            <div class="search-box-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="itemSearch" class="search-input" placeholder="Search item (e.g. shirt, pant, lipstick, fan)..." oninput="filterProducts()">
            </div>
            
            <div class="filter-scroller" id="filterTabs">
                <button class="tab-pill active" onclick="filterCategory('all', this)">✨ All Collections</button>
                <button class="tab-pill" onclick="filterCategory('shirt', this)">👔 Shirts</button>
                <button class="tab-pill" onclick="filterCategory('pant', this)">👖 Pants</button>
                <button class="tab-pill" onclick="filterCategory('lipstick', this)">💄 Cosmetics & Lipsticks</button>
                <button class="tab-pill" onclick="filterCategory('fan', this)">🔌 Fans & Appliances</button>
                <button class="tab-pill" onclick="filterCategory('offer', this)">🔥 Mega Offers</button>
            </div>
        </div>

        <h2 class="section-heading">🔥 Handpicked For You</h2>
        
        <!-- Live Grid -->
        <div id="productList" class="product-showroom">
            <!-- Setup Skeleton Shimmer Screen Preloaders visually for smooth initial load states -->
            <div class="skeleton-card"><div class="skeleton-block" style="height:200px;"></div><div class="skeleton-block" style="height:20px; width:70%;"></div><div class="skeleton-block" style="height:30px; width:40%;"></div><div class="skeleton-block" style="height:45px; margin-top:auto;"></div></div>
            <div class="skeleton-card"><div class="skeleton-block" style="height:200px;"></div><div class="skeleton-block" style="height:20px; width:70%;"></div><div class="skeleton-block" style="height:30px; width:40%;"></div><div class="skeleton-block" style="height:45px; margin-top:auto;"></div></div>
            <div class="skeleton-card"><div class="skeleton-block" style="height:200px;"></div><div class="skeleton-block" style="height:20px; width:70%;"></div><div class="skeleton-block" style="height:30px; width:40%;"></div><div class="skeleton-block" style="height:45px; margin-top:auto;"></div></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKVwHm3-RO3IkycB8VdwizUYQLgasGqzk",
            authDomain: "lucky-triode-450317-g7.firebaseapp.com",
            projectId: "lucky-triode-450317-g7",
            storageBucket: "lucky-triode-450317-g7.firebasestorage.app",
            messagingSenderId: "778199870672",
            appId: "1:778199870672:web:62a9891e41b3a3d3f242d5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let localProductsArray = [];
        let activeCategoryFilter = 'all';

        window.loadProfile = async function() {
            const user = JSON.parse(localStorage.getItem("currentUser"));
            if (!user) return;
            
            const profileCard = document.getElementById("profileCard");
            const userQuery = await getDocs(query(collection(db, "users"), where("uid", "==", user.uid)));
            
            if (!userQuery.empty) {
                const userData = userQuery.docs[0].data();
                const isGoogleUser = userData.authProvider === "google";
                const googleBadge = isGoogleUser ? '<span class="google-badge">Google</span>' : '';
                
                profileCard.innerHTML = `
                    ${userData.photoURL ? `<img class="profile-avatar" src="${userData.photoURL}" alt="Profile">` : `
                        <div class="profile-avatar" style="background: linear-gradient(135deg, #1e3a8a, #764ba2); display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; font-weight: bold;">
                            ${userData.name ? userData.name.charAt(0).toUpperCase() : 'U'}
                        </div>
                    `}
                    <div class="profile-info">
                        <h3>${userData.name || user.email} ${googleBadge}</h3>
                        <p>📧 ${user.email}</p>
                        <p>📍 Delivery Location: ${userData.area || "Not updated"}</p>
                    </div>
                `;
            } else {
                profileCard.innerHTML = `
                    <div class="profile-info">
                        <h3>Welcome Back!</h3>
                        <p>📧 Session Account: ${user.email}</p>
                    </div>
                `;
            }
        };

        window.loadProducts = async function() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                localProductsArray = [];
                querySnapshot.forEach((doc) => {
                    localProductsArray.push({ id: doc.id, ...doc.data() });
                });
                renderProductGrid(localProductsArray);
            } catch(err) {
                document.getElementById("productList").innerHTML = "<p style='padding:20px; text-align:center; color:#ef4444;'>Error loading products. Check console configs.</p>";
            }
        };

        function renderProductGrid(items) {
            const grid = document.getElementById("productList");
            grid.innerHTML = "";
            
            if (items.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px 20px; color: #94a3b8; font-weight: 500;">Aapki khoj ke mutabik koi product stock me nahi mila!</div>`;
                return;
            }

            items.forEach((product) => {
                const ratingCount = product.rating || 5;
                const stars = "★".repeat(ratingCount) + "☆".repeat(5 - ratingCount);
                
                const discount = product.mrp && product.price ? Math.round(((product.mrp - product.price) / product.mrp) * 100) : 0;
                const offerBadgeHtml = discount > 0 ? `<div class="badge-ribbon">🎁 ${discount}% OFF</div>` : '';

                grid.innerHTML += `
                    <div class="product-card">
                        ${offerBadgeHtml}
                        <div class="img-container">
                            <img src="${product.image || 'https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=500&q=80'}" alt="${product.name}" loading="lazy">
                        </div>
                        <div class="card-details">
                            <h3>${product.name}</h3>
                            <div class="stars-row">${stars}</div>
                            <div class="pricing-row">
                                <span class="price-tag">₹${product.price}</span>
                                ${product.mrp ? `<span class="mrp-tag">₹${product.mrp}</span>` : ''}
                            </div>
                            <p class="description-paragraph">${product.description || 'Premium lifestyle choice curated meticulously for your style statement.'}</p>
                            <a href="${product.link || '#'}" target="_blank" style="text-decoration: none; margin-top: auto;">
                                <button class="action-button">🛒 Buy Now</button>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        window.filterProducts = function() {
            const searchValue = document.getElementById("itemSearch").value.toLowerCase().trim();
            
            const filtered = localProductsArray.filter(product => {
                const matchesSearch = product.name.toLowerCase().includes(searchValue) || 
                                      (product.description && product.description.toLowerCase().includes(searchValue)) ||
                                      (product.category && product.category.toLowerCase().includes(searchValue));
                
                if (activeCategoryFilter === 'all') {
                    return matchesSearch;
                } else if (activeCategoryFilter === 'offer') {
                    const discount = product.mrp && product.price ? ((product.mrp - product.price) / product.mrp) * 100 : 0;
                    return matchesSearch && discount > 10;
                } else {
                    return matchesSearch && product.category && product.category.toLowerCase() === activeCategoryFilter;
                }
            });

            renderProductGrid(filtered);
        };

        window.filterCategory = function(categoryName, element) {
            document.querySelectorAll('.tab-pill').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            activeCategoryFilter = categoryName;
            filterProducts();
        };

        window.logout = async function() {
            await signOut(auth);
            localStorage.clear();
            window.location.href = "index.html";
        };

        window.checkAuth = function() {
            const currentUser = localStorage.getItem("currentUser");
            if (!currentUser) {
                window.location.href = "index.html";
            }
        };

        window.checkAuth();
        window.loadProfile();
        window.loadProducts();
    </script>
</body>
</html>
