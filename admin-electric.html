<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beauty Admin Panel | StyleEase</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Poppins, sans-serif;

            background: #f7f7f7;

            color: #222;

        }


        header {

            background: #222;

            color: white;

            padding: 20px 7%;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        header h1 {

            font-size: 25px;

        }


        header h1 span {

            color: #e91e63;

        }


        header p {

            font-size: 14px;

            color: #ddd;

        }


        .container {

            width: 90%;

            max-width: 1200px;

            margin: 35px auto;

        }


        .form-card {

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 25px rgba(0,0,0,0.08);

            margin-bottom: 40px;

        }


        .form-card h2 {

            margin-bottom: 25px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 7px;

        }


        input,

        textarea,

        select {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            outline: none;

            font-family: Poppins, sans-serif;

            font-size: 14px;

        }


        input:focus,

        textarea:focus,

        select:focus {

            border-color: #e91e63;

        }


        textarea {

            height: 100px;

            resize: vertical;

        }


        .add-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #e91e63;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

        }


        .add-btn:hover {

            background: #c2185b;

        }


        .add-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .message {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

        }


        .success {

            display: block;

            background: #e8f5e9;

            color: #2e7d32;

        }


        .error {

            display: block;

            background: #ffebee;

            color: #c62828;

        }


        .products-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .products-header h2 {

            font-size: 25px;

        }


        .product-count {

            background: #fce4ec;

            color: #c2185b;

            padding: 7px 14px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 600;

        }


        .products-grid {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 20px;

        }


        .product-card {

            background: white;

            border-radius: 12px;

            overflow: hidden;

            box-shadow: 0 5px 20px rgba(0,0,0,0.07);

        }


        .product-card img {

            width: 100%;

            height: 230px;

            object-fit: cover;

            background: #eee;

        }


        .product-info {

            padding: 15px;

        }


        .product-info h3 {

            font-size: 16px;

            margin-bottom: 8px;

        }


        .product-info p {

            color: #666;

            font-size: 13px;

            margin-bottom: 10px;

        }


        .price {

            color: #e91e63;

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 12px;

        }


        .beauty-label {

            display: inline-block;

            background: #fce4ec;

            color: #c2185b;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 11px;

            margin-bottom: 10px;

        }


        .delete-btn {

            width: 100%;

            padding: 9px;

            border: none;

            border-radius: 6px;

            background: #d32f2f;

            color: white;

            cursor: pointer;

            font-weight: 600;

        }


        .delete-btn:hover {

            background: #b71c1c;

        }


        .loading,

        .empty {

            grid-column: 1 / -1;

            text-align: center;

            padding: 50px;

            color: #777;

        }


        @media (max-width: 1000px) {

            .products-grid {

                grid-template-columns: repeat(3, 1fr);

            }

        }


        @media (max-width: 700px) {

            .products-grid {

                grid-template-columns: repeat(2, 1fr);

            }

            header {

                padding: 18px 5%;

            }

            .container {

                width: 92%;

            }

        }


        @media (max-width: 450px) {

            .products-grid {

                grid-template-columns: 1fr;

            }

            header {

                display: block;

            }

            header p {

                margin-top: 5px;

            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <h1>

            Style<span>Ease</span> Beauty Admin

        </h1>


        <p>

            Beauty Products Management

        </p>

    </header>


    <main class="container">


        <!-- ADD BEAUTY PRODUCT -->

        <section class="form-card">


            <h2>

                Add Beauty Product

            </h2>


            <form id="beautyForm">


                <div class="form-group">

                    <label>

                        Product Name

                    </label>


                    <input

                        type="text"

                        id="productTitle"

                        placeholder="Example: Matte Lipstick"

                        required

                    >

                </div>


                <div class="form-group">

                    <label>

                        Beauty Category

                    </label>


                    <select

                        id="beautyCategory"

                        required

                    >

                        <option value="">

                            Select Category

                        </option>


                        <option value="makeup">

                            Makeup

                        </option>


                        <option value="skincare">

                            Skincare

                        </option>


                        <option value="hair-care">

                            Hair Care

                        </option>


                        <option value="beauty-products">

                            Beauty Products

                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>

                        Price

                    </label>


                    <input

                        type="number"

                        id="productPrice"

                        placeholder="Example: 499"

                        required

                    >

                </div>


                <div class="form-group">

                    <label>

                        Product Image URL

                    </label>


                    <input

                        type="url"

                        id="productImage"

                        placeholder="https://example.com/image.jpg"

                        required

                    >

                </div>


                <div class="form-group">

                    <label>

                        Product Buy Link

                    </label>


                    <input

                        type="url"

                        id="productLink"

                        placeholder="Amazon / Affiliate Product Link"

                        required

                    >

                </div>


                <div class="form-group">

                    <label>

                        Product Description

                    </label>


                    <textarea

                        id="productDescription"

                        placeholder="Write beauty product description..."

                        required

                    ></textarea>

                </div>


                <button

                    type="submit"

                    class="add-btn"

                    id="addBtn"

                >

                    Add Beauty Product

                </button>


                <div

                    id="message"

                    class="message"

                ></div>


            </form>

        </section>


        <!-- PRODUCT LIST -->

        <section>


            <div class="products-header">


                <h2>

                    All Beauty Products

                </h2>


                <span

                    class="product-count"

                    id="productCount"

                >

                    0 Products

                </span>


            </div>


            <div

                class="products-grid"

                id="productsGrid"

            >

                <div class="loading">

                    Loading beauty products...

                </div>

            </div>

        </section>


    </main>


    <!-- FIREBASE -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


    <script>


        /* ================= FIREBASE CONFIG ================= */


        const firebaseConfig = {

            apiKey:

                "AIzaSyDKVwHm3-RO3IkycB8VdwizUYQLgasGqzk",

            authDomain:

                "lucky-triode-450317-g7.firebaseapp.com",

            databaseURL:

                "https://lucky-triode-450317-g7-default-rtdb.firebaseio.com/",

            projectId:

                "lucky-triode-450317-g7",

            storageBucket:

                "lucky-triode-450317-g7.firebasestorage.app",

            messagingSenderId:

                "778199870672",

            appId:

                "1:778199870672:web:62a9891e41b3a3d3f242d5"

        };


        firebase.initializeApp(firebaseConfig);


        const database =

            firebase.database();


        /* ================= ELEMENTS ================= */


        const beautyForm =

            document.getElementById(

                "beautyForm"

            );


        const productTitle =

            document.getElementById(

                "productTitle"

            );


        const beautyCategory =

            document.getElementById(

                "beautyCategory"

            );


        const productPrice =

            document.getElementById(

                "productPrice"

            );


        const productImage =

            document.getElementById(

                "productImage"

            );


        const productLink =

            document.getElementById(

                "productLink"

            );


        const productDescription =

            document.getElementById(

                "productDescription"

            );


        const addBtn =

            document.getElementById(

                "addBtn"

            );


        const message =

            document.getElementById(

                "message"

            );


        const productsGrid =

            document.getElementById(

                "productsGrid"

            );


        const productCount =

            document.getElementById(

                "productCount"

            );


        /* ================= ADD PRODUCT ================= */


        beautyForm.addEventListener(

            "submit",

            function(event) {


                event.preventDefault();


                const productData = {


                    title:

                        productTitle.value.trim(),


                    beautyCategory:

                        beautyCategory.value,


                    price:

                        productPrice.value.trim(),


                    imageUrl:

                        productImage.value.trim(),


                    buyLink:

                        productLink.value.trim(),


                    description:

                        productDescription.value.trim(),


                    category:

                        "beauty",


                    createdAt:

                        Date.now()

                };


                if (

                    !productData.title ||

                    !productData.beautyCategory ||

                    !productData.price ||

                    !productData.imageUrl ||

                    !productData.buyLink ||

                    !productData.description

                ) {


                    showMessage(

                        "Please fill all fields.",

                        "error"

                    );


                    return;

                }


                addBtn.disabled = true;


                addBtn.textContent =

                    "Adding Product...";


                /*

                    ONLY BEAUTY PATH

                    products/beauty

                */


                database

                    .ref(

                        "products/beauty"

                    )

                    .push(productData)

                    .then(

                        function() {


                            showMessage(

                                "Beauty product added successfully!",

                                "success"

                            );


                            beautyForm.reset();


                            addBtn.disabled = false;


                            addBtn.textContent =

                                "Add Beauty Product";


                            loadBeautyProducts();

                        }

                    )

                    .catch(

                        function(error) {


                            console.error(error);


                            showMessage(

                                error.message,

                                "error"

                            );


                            addBtn.disabled = false;


                            addBtn.textContent =

                                "Add Beauty Product";

                        }

                    );

            }

        );


        /* ================= LOAD PRODUCTS ================= */


        function loadBeautyProducts() {


            productsGrid.innerHTML = `

                <div class="loading">

                    Loading beauty products...

                </div>

            `;


            database

                .ref(

                    "products/beauty"

                )

                .once(

                    "value"

                )

                .then(

                    function(snapshot) {


                        const products =

                            snapshot.val();


                        productsGrid.innerHTML = "";


                        if (!products) {


                            productCount.textContent =

                                "0 Products";


                            productsGrid.innerHTML = `

                                <div class="empty">

                                    No beauty products added yet.

                                </div>

                            `;


                            return;

                        }


                        const productKeys =

                            Object.keys(products);


                        productCount.textContent =

                            productKeys.length +

                            " Products";


                        productKeys

                            .reverse()

                            .forEach(

                                function(productId) {


                                    createProductCard(

                                        products[productId],

                                        productId

                                    );

                                }

                            );

                    }

                )

                .catch(

                    function(error) {


                        console.error(error);


                        productsGrid.innerHTML = `

                            <div class="empty">

                                Unable to load products.

                            </div>

                        `;

                    }

                );

        }


        /* ================= CREATE CARD ================= */


        function createProductCard(

            product,

            productId

        ) {


            const card =

                document.createElement(

                    "div"

                );


            card.className =

                "product-card";


            card.innerHTML = `

                <img

                    src="${safeURL(product.imageUrl)}"

                    alt="${escapeHTML(product.title)}"

                    loading="lazy"

                >


                <div class="product-info">


                    <span class="beauty-label">

                        💄 ${escapeHTML(

                            product.beautyCategory

                        )}

                    </span>


                    <h3>

                        ${escapeHTML(

                            product.title

                        )}

                    </h3>


                    <p>

                        ${escapeHTML(

                            product.description

                        )}

                    </p>


                    <div class="price">

                        ₹${escapeHTML(

                            product.price

                        )}

                    </div>


                    <button

                        class="delete-btn"

                        onclick="deleteBeautyProduct(

                            '${productId}'

                        )"

                    >

                        Delete Product

                    </button>


                </div>

            `;


            productsGrid.appendChild(

                card

            );

        }


        /* ================= DELETE ================= */


        function deleteBeautyProduct(

            productId

        ) {


            const confirmDelete =

                confirm(

                    "Delete this beauty product?"

                );


            if (!confirmDelete) {

                return;

            }


            database

                .ref(

                    "products/beauty/" +

                    productId

                )

                .remove()

                .then(

                    function() {


                        showMessage(

                            "Beauty product deleted successfully.",

                            "success"

                        );


                        loadBeautyProducts();

                    }

                )

                .catch(

                    function(error) {


                        showMessage(

                            error.message,

                            "error"

                        );

                    }

                );

        }


        /* ================= MESSAGE ================= */


        function showMessage(

            text,

            type

        ) {


            message.textContent =

                text;


            message.className =

                "message " +

                type;


            setTimeout(

                function() {


                    message.className =

                        "message";

                },

                4000

            );

        }


        /* ================= ESCAPE HTML ================= */


        function escapeHTML(

            value

        ) {


            return String(

                value || ""

            ).replace(

                /[&<>"']/g,

                function(match) {


                    return {


                        "&": "&amp;",

                        "<": "&lt;",

                        ">": "&gt;",

                        '"': "&quot;",

                        "'": "&#039;"

                    }[match];

                }

            );

        }


        /* ================= SAFE URL ================= */


        function safeURL(

            value

        ) {


            const url =

                String(

                    value || ""

                ).trim();


            if (

                url.startsWith(

                    "https://"

                ) ||

                url.startsWith(

                    "http://"

                )

            ) {


                return url;

            }


            return "";

        }


        /* ================= INITIAL LOAD ================= */


        loadBeautyProducts();


    </script>

</body>

</html>
