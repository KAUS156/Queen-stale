<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footwear Storage Control Panel | StyleEasy</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root { --primary-color: #111111; --accent-color: #ff5a5f; --text-color: #333333; --light-bg: #f4f5f8; --white: #ffffff; --danger-color: #e74c3c; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--light-bg); color: var(--text-color); display: flex; min-height: 100vh; }
        aside { width: 260px; background: var(--primary-color); color: var(--white); padding: 30px 20px; position: fixed; height: 100vh; border-right: 2px solid var(--accent-color); }
        aside .logo { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 40px; }
        aside ul li a { color: #ccc; text-decoration: none; padding: 12px; display: flex; align-items: center; gap: 12px; border-radius: 6px; font-size: 14px; }
        aside ul li a.active { background: rgba(255,90,95,0.15); color: var(--accent-color); }
        main { margin-left: 260px; flex: 1; padding: 40px; width: calc(100% - 260px); }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 30px; }
        .card { background: var(--white); padding: 30px; border-radius: 12px; border: 1px solid #eef2f5; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 13.5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; background: #fafafa; }
        .btn { background: var(--primary-color); color: var(--white); border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.3s; }
        .btn:hover { background: var(--accent-color); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid #eee; font-size: 13.5px; }
        th { background: #f8f9fa; }
        .img-preview { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; }
        .delete-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 16px; }
        @media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <aside><div class="logo">StyleEasy</div><ul><li><a href="#" class="active"><i class="fas fa-shoe-prints"></i> <span>Footwear Control</span></a></li></ul></aside>
    <main>
        <header><h2>Footwear Live Warehouse</h2><div><i class="fas fa-circle" style="color: #2ecc71"></i> Connected Node: /footwear</div></header>
        <div class="dashboard-grid">
            <section class="card">
                <h3>Add New Footwear</h3><br>
                <form id="footwearForm">
                    <div class="form-group"><label>Product Title</label><input type="text" id="title" required></div>
                    <div class="form-group"><label>Price (₹)</label><input type="number" id="price" required></div>
                    <div class="form-group"><label>Image URL</label><input type="url" id="imageUrl" required></div>
                    <div class="form-group"><label>WhatsApp Order Link</label><input type="url" id="buyLink" required></div>
                    <div class="form-group"><label>Item Description / Sizes Available</label><textarea id="description" rows="4" required></textarea></div>
                    <button type="submit" class="btn">Launch to Footwear Store</button>
                </form>
            </section>
            <section class="card">
                <h3>Live Showroom Monitor</h3><br>
                <table>
                    <thead><tr><th>Image</th><th>Title</th><th>Price</th><th>Action</th></tr></thead>
                    <tbody id="inventoryTable"></tbody>
                </table>
            </section>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDKVwHm3-RO3IkycB8VdwizUYQLgasGqzk", authDomain: "lucky-triode-450317-g7.firebaseapp.com", databaseURL: "https://lucky-triode-450317-g7-default-rtdb.firebaseio.com/", projectId: "lucky-triode-450317-g7", storageBucket: "lucky-triode-450317-g7.firebasestorage.app", messagingSenderId: "778199870672", appId: "1:778199870672:web:62a9891e41b3a3d3f242d5" };
        firebase.initializeApp(firebaseConfig); const database = firebase.database();
        const form = document.getElementById('footwearForm'); const tableBody = document.getElementById('inventoryTable');

        database.ref('products/footwear').on('value', (snapshot) => {
            tableBody.innerHTML = ''; const data = snapshot.val();
            if(!data) { tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;padding:20px;">Warehouse empty.</td></tr>'; return; }
            Object.keys(data).forEach((key) => {
                const p = data[key];
                tableBody.innerHTML += `<tr>
                    <td><img src="${p.imageUrl}" class="img-preview"></td>
                    <td><b>${p.title}</b></td><td>₹${p.price}</td>
                    <td><button class="delete-btn" onclick="deleteItem('${key}')"><i class="fas fa-trash-alt"></i></button></td>
                </tr>`;
            });
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const item = { title: document.getElementById('title').value.trim(), price: document.getElementById('price').value.trim(), imageUrl: document.getElementById('imageUrl').value.trim(), buyLink: document.getElementById('buyLink').value.trim(), description: document.getElementById('description').value.trim() };
            database.ref('products/footwear').push(item).then(() => { alert('Footwear Published!'); form.reset(); });
        });
        window.deleteItem = function(key) { if(confirm("Permanently delete item?")) database.ref('products/footwear').child(key).remove(); }
    </script>
</body>
</html>
