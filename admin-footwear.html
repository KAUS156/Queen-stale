<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleEase Admin Panel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Poppins, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .admin-header {
            background: #222;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            font-size: 24px;
        }

        .admin-header span {
            color: #e91e63;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .form-card {
            background: white;
            padding: 28px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            margin-bottom: 35px;
        }

        .form-card h2 {
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #e91e63;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #e91e63;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #c2185b;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .error {
            display: block;
            background: #ffebee;
            color: #c62828;
        }

        .products-section h2 {
            margin-bottom: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product-info h3 {
            font-size: 16px;
            margin-bottom: 7px;
        }

        .product-info p {
            color: #666;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .price {
            color: #e91e63;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .category-label {
            display: inline-block;
            background: #fce4ec;
            color: #c2185b;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            margin-bottom: 10px;
        }

        .delete-btn {
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 6px;
            background: #d32f2f;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 1000px) {

            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 700px) {

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .admin-header {
                padding: 18px 5%;
            }

            .container {
                width: 92%;
            }

        }

        @media (max-width: 450px) {

            .products-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>


    <!-- ================= HEADER ================= -->

    <header class="admin-header">

        <h1>
            Style<span>Ease</span> Admin
        </h1>

        <p>
            Footwear Management
        </p>

    </header>


    <main class="container">


        <!-- ================= ADD PRODUCT ================= -->

        <section class="form-card">

            <h2>
                Add New Footwear Product
            </h2>


            <form id="productForm">


                <!-- PRODUCT TITLE -->

                <div class="form-group">

                    <label>
                        Product Title
                    </label>

                    <input

                        type="text"

                        id="productTitle"

                        placeholder="Example: Men's Casual Sneakers"

                        required

                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label>
                        Select Category
                    </label>

                    <select

                        id="productCategory"

                        required

                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="men-footwear">
                            Men's Footwear
                        </option>

                        <option value="women-footwear">
                            Women's Footwear
                        </option>

                    </select>

                </div>


                <!-- PRICE -->

                <div class="form-group">

                    <label>
                        Price
                    </label>

                    <input

                        type="number"

                        id="productPrice"

                        placeholder="Example: 999"

                        required

                    >

                </div>


                <!-- IMAGE URL -->

                <div class="form-group">

                    <label>
                        Product Image URL
                    </label>

                    <input

                        type="url"

                        id="productImage"

                        placeholder="https://example.com/image.jpg"

                        required

                    >

                </div>


                <!-- BUY LINK -->

                <div class="form-group">

                    <label>
                        Product Buy Link
                    </label>

                    <input

                        type="url"

                        id="productLink"

                        placeholder="Amazon/Affiliate Product Link"

                        required

                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label>
                        Product Description
                    </label>

                    <textarea

                        id="productDescription"

                        placeholder="Write product description..."

                        required

                    ></textarea>

                </div>


                <!-- SUBMIT -->

                <button

                    type="submit"

                    class="btn"

                    id="submitBtn"

                >

                    Add Product

                </button>


                <div

                    id="message"

                    class="message"

                ></div>


            </form>

        </section>


        <!-- ================= PRODUCT LIST ================= -->

        <section class="products-section">

            <h2>
                All Footwear Products
            </h2>


            <div

                class="products-grid"

                id="productsGrid"

            >

                <div class="loading">

                    Loading products...

                </div>

            </div>

        </section>


    </main>


    <!-- ================= FIREBASE ================= -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


    <script>


        /* ================= FIREBASE CONFIG ================= */


        const firebaseConfig = {

            apiKey:

                "AIzaSyDKVwHm3-RO3IkycB8VdwizUYQLgasGqzk",

            authDomain:

                "lucky-triode-450317-g7.firebaseapp.com",

            databaseURL:

                "https://lucky-triode-450317-g7-default-rtdb.firebaseio.com/",

            projectId:

                "lucky-triode-450317-g7",

            storageBucket:

                "lucky-triode-450317-g7.firebasestorage.app",

            messagingSenderId:

                "778199870672",

            appId:

                "1:778199870672:web:62a9891e41b3a3d3f242d5"

        };


        /* ================= INITIALIZE FIREBASE ================= */


        firebase.initializeApp(firebaseConfig);


        const database = firebase.database();


        /* ================= FORM ================= */


        const productForm =

            document.getElementById(

                "productForm"

            );


        const productTitle =

            document.getElementById(

                "productTitle"

            );


        const productCategory =

            document.getElementById(

                "productCategory"

            );


        const productPrice =

            document.getElementById(

                "productPrice"

            );


        const productImage =

            document.getElementById(

                "productImage"

            );


        const productLink =

            document.getElementById(

                "productLink"

            );


        const productDescription =

            document.getElementById(

                "productDescription"

            );


        const submitBtn =

            document.getElementById(

                "submitBtn"

            );


        const message =

            document.getElementById(

                "message"

            );


        const productsGrid =

            document.getElementById(

                "productsGrid"

            );


        /* ================= ADD PRODUCT ================= */


        productForm.addEventListener(

            "submit",

            function(event) {


                event.preventDefault();


                const title =

                    productTitle.value.trim();


                const category =

                    productCategory.value;


                const price =

                    productPrice.value.trim();


                const imageUrl =

                    productImage.value.trim();


                const buyLink =

                    productLink.value.trim();


                const description =

                    productDescription.value.trim();


                if (

                    !title ||

                    !category ||

                    !price ||

                    !imageUrl ||

                    !buyLink ||

                    !description

                ) {


                    showMessage(

                        "Please fill all fields.",

                        "error"

                    );


                    return;

                }


                submitBtn.disabled = true;


                submitBtn.textContent =

                    "Adding Product...";


                const productData = {


                    title: title,

                    price: price,

                    imageUrl: imageUrl,

                    buyLink: buyLink,

                    description: description,

                    category: category,

                    createdAt:

                        Date.now()

                };


                /*

                IMPORTANT:

                Category decides Firebase path

                */


                const databasePath =

                    "products/" +

                    category;


                database

                    .ref(databasePath)

                    .push(productData)

                    .then(

                        function() {


                            showMessage(

                                "Product added successfully!",

                                "success"

                            );


                            productForm.reset();


                            submitBtn.disabled = false;


                            submitBtn.textContent =

                                "Add Product";

                        }

                    )

                    .catch(

                        function(error) {


                            console.error(error);


                            showMessage(

                                "Error: " +

                                error.message,

                                "error"

                            );


                            submitBtn.disabled = false;


                            submitBtn.textContent =

                                "Add Product";

                        }

                    );

            }

        );


        /* ================= LOAD PRODUCTS ================= */


        function loadAllProducts() {


            productsGrid.innerHTML =

                `<div class="loading">

                    Loading products...

                </div>`;


            const categories = [

                "men-footwear",

                "women-footwear"

            ];


            const requests = categories.map(

                function(category) {


                    return database

                        .ref(

                            "products/" +

                            category

                        )

                        .once(

                            "value"

                        );

                }

            );


            Promise.all(requests)

                .then(

                    function(snapshots) {


                        productsGrid.innerHTML = "";


                        let totalProducts = 0;


                        snapshots.forEach(

                            function(snapshot, index) {


                                const category =

                                    categories[index];


                                const products =

                                    snapshot.val();


                                if (!products) {

                                    return;

                                }


                                Object.keys(products)

                                    .reverse()

                                    .forEach(

                                        function(key) {


                                            totalProducts++;


                                            const product =

                                                products[key];


                                            createProductCard(

                                                product,

                                                key,

                                                category

                                            );

                                        }

                                    );

                            }

                        );


                        if (

                            totalProducts === 0

                        ) {


                            productsGrid.innerHTML = `

                                <div class="loading">

                                    No products found.

                                </div>

                            `;

                        }

                    }

                )

                .catch(

                    function(error) {


                        console.error(error);


                        productsGrid.innerHTML = `

                            <div class="loading">

                                Unable to load products.

                            </div>

                        `;

                    }

                );

        }


        /* ================= CREATE CARD ================= */


        function createProductCard(

            product,

            productId,

            category

        ) {


            const card =

                document.createElement(

                    "div"

                );


            card.className =

                "product-card";


            const categoryName =

                category ===

                    "men-footwear"

                    ?

                    "Men's Footwear"

                    :

                    "Women's Footwear";


            card.innerHTML = `

                <img

                    src="${safeURL(product.imageUrl)}"

                    alt="${escapeHTML(product.title)}"

                    loading="lazy"

                >


                <div class="product-info">


                    <span class="category-label">

                        ${categoryName}

                    </span>


                    <h3>

                        ${escapeHTML(product.title)}

                    </h3>


                    <p>

                        ${escapeHTML(product.description)}

                    </p>


                    <div class="price">

                        ₹${escapeHTML(product.price)}

                    </div>


                    <button

                        class="delete-btn"

                        onclick="deleteProduct(

                            '${category}',

                            '${productId}'

                        )"

                    >

                        Delete Product

                    </button>


                </div>

            `;


            productsGrid.appendChild(card);

        }


        /* ================= DELETE PRODUCT ================= */


        function deleteProduct(

            category,

            productId

        ) {


            const confirmDelete =

                confirm(

                    "Are you sure you want to delete this product?"

                );


            if (!confirmDelete) {

                return;

            }


            database

                .ref(

                    "products/" +

                    category +

                    "/" +

                    productId

                )

                .remove()

                .then(

                    function() {


                        showMessage(

                            "Product deleted successfully.",

                            "success"

                        );


                        loadAllProducts();

                    }

                )

                .catch(

                    function(error) {


                        showMessage(

                            error.message,

                            "error"

                        );

                    }

                );

        }


        /* ================= MESSAGE ================= */


        function showMessage(

            text,

            type

        ) {


            message.textContent = text;


            message.className =

                "message " +

                type;


            setTimeout(

                function() {


                    message.className =

                        "message";

                },

                4000

            );

        }


        /* ================= ESCAPE HTML ================= */


        function escapeHTML(value) {


            return String(

                value || ""

            ).replace(

                /[&<>"']/g,

                function(match) {


                    return {


                        "&": "&amp;",

                        "<": "&lt;",

                        ">": "&gt;",

                        '"': "&quot;",

                        "'": "&#039;"

                    }[match];

                }

            );

        }


        /* ================= SAFE URL ================= */


        function safeURL(value) {


            const url =

                String(

                    value || ""

                ).trim();


            if (

                url.startsWith(

                    "https://"

                ) ||

                url.startsWith(

                    "http://"

                )

            ) {


                return url;

            }


            return "";

        }


        /* ================= INITIAL LOAD ================= */


        loadAllProducts();


    </script>


</body>

</html>
