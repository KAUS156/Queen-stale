    <style>
        :root { --primary-color: #0f172a; --accent-color: #0ea5e9; --text-color: #334155; --light-bg: #f8fafc; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--light-bg); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; }

        .page-title-bar p { font-size: 16px; color: #94a3b8; }
        main { flex: 1; max-width: 1200px; width: 100%; margin: 40px auto; padding: 0 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        .product-card { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.01); display: flex; flex-direction: column; border: 1px solid #e2e8f0; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--accent-color); box-shadow: 0 10px 25px rgba(14, 165, 233, 0.1); }
        .product-img-container { width: 100%; height: 260px; overflow: hidden; background: #f1f5f9; }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
        .product-card:hover .product-img { transform: scale(1.05); }
        .product-info { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 18px; font-weight: 600; color: var(--primary-color); margin-bottom: 8px; }
        .product-desc { font-size: 13.5px; color: #64748b; margin-bottom: 20px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .product-price { font-size: 20px; font-weight: 700; color: var(--accent-color); }
        .add-to-cart-btn { background: var(--primary-color); color: var(--white); text-decoration: none; padding: 11px 18px; border-radius: 6px; font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 8px; border: 1px solid var(--primary-color); transition: 0.3s; }
        .add-to-cart-btn:hover { background: transparent; color: var(--primary-color); }

<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Style<span>Easy</span></a>
            <div class="search-container"><input type="text" id="searchInput" class="search-input" placeholder="Search tech gear..." aria-label="Search Collection"><i class="fas fa-search"></i></div>
        </div>
    </header>
    <section class="page-title-bar"><h1>Electronics Engine</h1><p>Futuristic devices built for ultimate technical utility</p></section>
    <main><div class="products-grid" id="productsContainer" aria-live="polite"></div></main>
    <footer><p>&copy; 2026 StyleEasy Electronics Tech. All Rights Reserved.</p></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDKVwHm3-RO3IkycB8VdwizUYQLgasGqzk", authDomain: "lucky-triode-450317-g7.firebaseapp.com", databaseURL: "https://lucky-triode-450317-g7-default-rtdb.firebaseio.com/", projectId: "lucky-triode-450317-g7", storageBucket: "lucky-triode-450317-g7.firebasestorage.app", messagingSenderId: "778199870672", appId: "1:778199870672:web:62a9891e41b3a3d3f242d5" };
        firebase.initializeApp(firebaseConfig); const database = firebase.database(); let electronicProducts = [];

        function syncElectricStore() {
            database.ref('products/electronics').on('value', (snapshot) => {
                electronicProducts = []; const cloudData = snapshot.val();
                if (cloudData) { Object.keys(cloudData).forEach(key => { electronicProducts.push(cloudData[key]); }); }
                renderProducts(electronicProducts);
            });
        }

        function renderProducts(list) {
            const container = document.getElementById('productsContainer'); container.innerHTML = '';
            if (list.length === 0) { container.innerHTML = '<div class="empty-state"><p>Devices network offline. New components loading soon.</p></div>'; return; }
            list.forEach(p => {
                const title = escapeHTML(p.title || 'Smart Gadget');
                const desc = escapeHTML(p.description || 'High-performance electronic hardware ecosystem.');
                container.innerHTML += `
                    <article class="product-card">
                        <div class="product-img-container"><img src="${p.imageUrl}" alt="Buy ${title}" class="product-img" loading="lazy"></div>
                        <div class="product-info">
                            <h2 class="product-title">${title}</h2><p class="product-desc">${desc}</p>
                            <div class="product-price-row"><span class="product-price">₹${escapeHTML(p.price)}</span>
                            <a href="${p.buyLink}" target="_blank" rel="noopener" class="add-to-cart-btn"><i class="fas fa-bolt"></i> Order Now</a></div>
                        </div>
                    </article>`;
            });
        }
        function escapeHTML(str) { return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])); }
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase().trim();
            const filtered = electronicProducts.filter(p => (p.title||'').toLowerCase().includes(term) || (p.description||'').toLowerCase().includes(term));
            renderProducts(filtered);
        });
        window.addEventListener('DOMContentLoaded', syncElectricStore);
    </script>
</body>
