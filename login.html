<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen Style - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; margin-bottom: 30px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #5a67d8; }
        .google-btn {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn:hover { background: #f5f5f5; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: #667eea; text-decoration: none; }
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ddd;
        }
        .divider span {
            background: white;
            padding: 0 10px;
            position: relative;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Queen Style Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="loginWithEmail()">Login with Email</button>
        
        <div class="divider"><span>OR</span></div>
        
        <button class="google-btn" onclick="loginWithGoogle()">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>
        
        <div class="link">
            <a href="register.html">New User? Register Here</a>
        </div>
        <div style="margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 8px;">
            <p style="font-size: 12px; text-align: center;">📝 Demo: admin@queenstyle.com / admin123</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDocs, query, where, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKVwHm3-RO3IkycB8VdwizUYQLgasGqzk",
            authDomain: "lucky-triode-450317-g7.firebaseapp.com",
            projectId: "lucky-triode-450317-g7",
            storageBucket: "lucky-triode-450317-g7.firebasestorage.app",
            messagingSenderId: "778199870672",
            appId: "1:778199870672:web:62a9891e41b3a3d3f242d5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Email/Password Login
        window.loginWithEmail = async function() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                alert("Please fill all fields!");
                return;
            }

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                let isAdmin = false;
                
                // Check if admin
                if (email === "mailak@gmail.com") {
                    isAdmin = true;
                } else {
                    const userQuery = await getDocs(query(collection(db, "users"), where("uid", "==", user.uid)));
                    if (!userQuery.empty) {
                        const userData = userQuery.docs[0].data();
                        isAdmin = userData.isAdmin === true;
                    }
                }
                
                localStorage.setItem("isAdmin", isAdmin ? "true" : "false");
                localStorage.setItem("currentUser", JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    isAdmin: isAdmin
                }));
                
                if (isAdmin) {
                    alert("Admin Login Successful!");
                    window.location.href = "admin.html";
                } else {
                    alert("Login Successful!");
                    window.location.href = "profile.html";
                }
            } catch (error) {
                alert("Login failed: " + error.message);
            }
        };

        // Google Login
        window.loginWithGoogle = async function() {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                // Check if user exists in Firestore
                const userQuery = await getDocs(query(collection(db, "users"), where("uid", "==", user.uid)));
                
                let isAdmin = false;
                
                // Check if this Google email is admin
                if (user.email === "mailak@gmail.com") {
                    isAdmin = true;
                }
                
                // If user doesn't exist in Firestore, create new entry
                if (userQuery.empty && !isAdmin) {
                    await addDoc(collection(db, "users"), {
                        uid: user.uid,
                        name: user.displayName || user.email.split('@')[0],
                        email: user.email,
                        area: "Google User",
                        isAdmin: false,
                        photoURL: user.photoURL,
                        authProvider: "google",
                        createdAt: new Date().toISOString()
                    });
                }
                
                localStorage.setItem("isAdmin", isAdmin ? "true" : "false");
                localStorage.setItem("currentUser", JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    name: user.displayName,
                    isAdmin: isAdmin,
                    photoURL: user.photoURL
                }));
                
                if (isAdmin) {
                    alert("Admin Login Successful!");
                    window.location.href = "admin.html";
                } else {
                    alert("Google Login Successful!");
                    window.location.href = "profile.html";
                }
            } catch (error) {
                console.error("Google Login Error:", error);
                alert("Google Login failed: " + error.message);
            }
        };

        // Check if already logged in
        const currentUser = localStorage.getItem("currentUser");
        if (currentUser) {
            const user = JSON.parse(currentUser);
            if (user.isAdmin) {
                window.location.href = "admin.html";
            } else {
                window.location.href = "profile.html";
            }
        }
    </script>
</body>
</html>
