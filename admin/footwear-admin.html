<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Footwear Admin | StyleEasy</title>
  <meta name="robots" content="noindex,nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#6b365f;
      --dark:#44213d;
      --accent:#c98ca2;
      --bg:#f8f4f6;
      --white:#fff;
      --text:#292329;
      --muted:#777078;
      --border:#e8dfe5;
      --danger:#c53f4d;
      --success:#267044;
      --shadow:0 15px 40px rgba(60,30,55,.10);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:"DM Sans",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button,input,textarea,select{font:inherit}

    .login{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      background:
        radial-gradient(circle at 10% 10%,#ead7e3,transparent 35%),
        radial-gradient(circle at 90% 90%,#ead9df,transparent 35%),
        var(--bg);
    }

    .login-card{
      width:100%;
      max-width:430px;
      background:#fff;
      padding:38px;
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
    }

    .logo{
      text-align:center;
      font:700 34px "Playfair Display",serif;
      color:var(--primary);
      margin-bottom:8px;
    }

    .logo span{color:var(--accent)}

    .login-card h2{
      text-align:center;
      margin-bottom:8px;
    }

    .login-card>p{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      margin-bottom:25px;
    }

    .field{
      margin-bottom:16px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin-bottom:7px;
    }

    input,textarea,select{
      width:100%;
      border:1px solid var(--border);
      border-radius:11px;
      padding:12px 13px;
      outline:none;
      background:#fff;
    }

    input:focus,textarea:focus,select:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(107,54,95,.08);
    }

    textarea{
      min-height:110px;
      resize:vertical;
    }

    .btn{
      border:0;
      border-radius:11px;
      padding:12px 18px;
      cursor:pointer;
      font-weight:700;
    }

    .primary{
      background:var(--primary);
      color:#fff;
    }

    .primary:hover{background:var(--dark)}

    .full{width:100%}

    .error{
      color:var(--danger);
      background:#fff0f1;
      padding:10px;
      border-radius:9px;
      font-size:13px;
      margin-top:12px;
      display:none;
    }

    /* DASHBOARD */

    .dashboard{
      display:none;
      min-height:100vh;
    }

    .topbar{
      height:72px;
      background:#fff;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 30px;
      position:sticky;
      top:0;
      z-index:20;
    }

    .top-logo{
      font:700 27px "Playfair Display",serif;
      color:var(--primary);
    }

    .top-logo span{color:var(--accent)}

    .top-right{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .admin-email{
      font-size:13px;
      color:var(--muted);
    }

    .logout{
      background:#f5e8ed;
      color:var(--primary);
    }

    .container{
      max-width:1250px;
      margin:auto;
      padding:30px 20px 60px;
    }

    .heading{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:20px;
      margin-bottom:25px;
    }

    .heading h1{
      font:700 40px "Playfair Display",serif;
    }

    .heading p{
      color:var(--muted);
      font-size:14px;
    }

    .grid{
      display:grid;
      grid-template-columns:380px 1fr;
      gap:25px;
      align-items:start;
    }

    .panel{
      background:#fff;
      border:1px solid var(--border);
      border-radius:20px;
      padding:25px;
      box-shadow:var(--shadow);
    }

    .panel h2{
      font:700 25px "Playfair Display",serif;
      margin-bottom:20px;
    }

    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .form-actions{
      display:flex;
      gap:10px;
      margin-top:20px;
    }

    .cancel{
      background:#eee8ec;
      color:var(--text);
      display:none;
    }

    .status{
      margin-top:14px;
      padding:10px;
      border-radius:9px;
      font-size:13px;
      display:none;
    }

    .success{
      background:#edf8f0;
      color:var(--success);
    }

    .products-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      margin-bottom:18px;
    }

    .count{
      font-size:13px;
      color:var(--muted);
    }

    .product-list{
      display:grid;
      gap:13px;
    }

    .product{
      display:grid;
      grid-template-columns:90px 1fr auto;
      gap:15px;
      align-items:center;
      padding:13px;
      border:1px solid var(--border);
      border-radius:15px;
    }

    .product img{
      width:90px;
      height:90px;
      border-radius:11px;
      object-fit:cover;
      background:#f5f1f3;
    }

    .product h3{
      font-size:15px;
      margin-bottom:4px;
    }

    .meta{
      color:var(--muted);
      font-size:12px;
    }

    .price{
      color:var(--primary);
      font-weight:700;
      margin-top:4px;
    }

    .actions{
      display:flex;
      gap:7px;
    }

    .edit{
      background:#f2e7ef;
      color:var(--primary);
    }

    .delete{
      background:#fff0f1;
      color:var(--danger);
    }

    @media(max-width:900px){
      .grid{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:600px){
      .topbar{
        padding:0 15px;
      }

      .admin-email{
        display:none;
      }

      .heading{
        display:block;
      }

      .heading h1{
        font-size:32px;
      }

      .two{
        grid-template-columns:1fr;
      }

      .product{
        grid-template-columns:70px 1fr;
      }

      .product img{
        width:70px;
        height:70px;
      }

      .actions{
        grid-column:1/-1;
      }

      .login-card{
        padding:25px;
      }
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section class="login" id="loginScreen">

  <div class="login-card">

    <div class="logo">
      Style<span>Easy</span>
    </div>

    <h2>Footwear Admin</h2>

    <p>Manage footwear products</p>

    <form id="loginForm">

      <div class="field">
        <label for="email">Admin Email</label>
        <input
          type="email"
          id="email"
          placeholder="admin@example.com"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >
      </div>

      <button class="btn primary full" type="submit">
        Login
      </button>

      <div class="error" id="loginError"></div>

    </form>

  </div>

</section>


<!-- ================= DASHBOARD ================= -->

<section class="dashboard" id="dashboard">

  <header class="topbar">

    <div class="top-logo">
      Style<span>Easy</span>
    </div>

    <div class="top-right">

      <span class="admin-email" id="adminEmail"></span>

      <button
        class="btn logout"
        id="logoutBtn"
      >
        Logout
      </button>

    </div>

  </header>


  <main class="container">

    <div class="heading">

      <div>
        <h1>Footwear Products</h1>
        <p>Add and manage products shown on the user website.</p>
      </div>

    </div>


    <div class="grid">

      <!-- ADD PRODUCT -->

      <div class="panel">

        <h2 id="formTitle">
          Add Product
        </h2>

        <form id="productForm">

          <div class="field">
            <label>Product Name *</label>
            <input
              id="productName"
              required
              placeholder="Premium Sneakers"
            >
          </div>

          <div class="two">

            <div class="field">
              <label>Category *</label>
              <select id="category" required>
                <option value="">Select</option>
                <option>Sneakers</option>
                <option>Running Shoes</option>
                <option>Casual Shoes</option>
                <option>Formal Shoes</option>
                <option>Sandals</option>
                <option>Slippers</option>
                <option>Heels</option>
                <option>Boots</option>
                <option>Sports Shoes</option>
                <option>Loafers</option>
                <option>Other</option>
              </select>
            </div>

            <div class="field">
              <label>Brand</label>
              <input
                id="brand"
                placeholder="Nike"
              >
            </div>

          </div>


          <div class="two">

            <div class="field">
              <label>Price *</label>
              <input
                type="number"
                id="price"
                min="0"
                required
                placeholder="1299"
              >
            </div>

            <div class="field">
              <label>Old Price</label>
              <input
                type="number"
                id="oldPrice"
                min="0"
                placeholder="1999"
              >
            </div>

          </div>


          <div class="field">
            <label>Gender</label>
            <select id="gender">
              <option value="Unisex">Unisex</option>
              <option value="Men">Men</option>
              <option value="Women">Women</option>
              <option value="Kids">Kids</option>
            </select>
          </div>


          <div class="field">
            <label>Image URL *</label>
            <input
              type="url"
              id="image"
              required
              placeholder="https://example.com/shoe.jpg"
            >
          </div>


          <div class="field">
            <label>Sizes</label>
            <input
              id="sizes"
              placeholder="6, 7, 8, 9, 10"
            >
          </div>


          <div class="field">
            <label>Description</label>
            <textarea
              id="description"
              placeholder="Product description..."
            ></textarea>
          </div>


          <div class="field">
            <label>SFF / Buy Link *</label>
            <input
              type="url"
              id="buyLink"
              required
              placeholder="https://..."
            >
          </div>


          <div class="form-actions">

            <button
              type="submit"
              class="btn primary"
              id="saveBtn"
            >
              Add Product
            </button>

            <button
              type="button"
              class="btn cancel"
              id="cancelBtn"
            >
              Cancel
            </button>

          </div>


          <div
            class="status success"
            id="status"
          ></div>

        </form>

      </div>


      <!-- PRODUCT LIST -->

      <div class="panel">

        <div class="products-head">

          <h2>
            Products
          </h2>

          <span
            class="count"
            id="productCount"
          >
            0 products
          </span>

        </div>


        <div
          class="product-list"
          id="productList"
        ></div>

      </div>

    </div>

  </main>

</section>


<!-- ================= FIREBASE ================= -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================== */

  const firebaseConfig = {
    apiKey: "AIzaSyDKVwHm3-RO3IkycB8VdwizUYQLgasGqzk",
    authDomain: "lucky-triode-450317-g7.firebaseapp.com",
    databaseURL: "https://lucky-triode-450317-g7-default-rtdb.firebaseio.com",
    projectId: "lucky-triode-450317-g7",
    storageBucket: "lucky-triode-450317-g7.firebasestorage.app",
    messagingSenderId: "778199870672",
    appId: "1:778199870672:web:62a9891e41b3a3d3f242d5",
    measurementId: "G-BD8Y4KXCKM"
  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  /* =========================================
     FOOTWEAR COLLECTION
  ========================================== */

  const footwearRef =
    collection(db, "footwear");


  /* =========================================
     ELEMENTS
  ========================================== */

  const loginScreen =
    document.getElementById("loginScreen");

  const dashboard =
    document.getElementById("dashboard");

  const loginForm =
    document.getElementById("loginForm");

  const loginError =
    document.getElementById("loginError");

  const adminEmail =
    document.getElementById("adminEmail");

  const productForm =
    document.getElementById("productForm");

  const productList =
    document.getElementById("productList");

  const productCount =
    document.getElementById("productCount");

  const statusBox =
    document.getElementById("status");

  const formTitle =
    document.getElementById("formTitle");

  const saveBtn =
    document.getElementById("saveBtn");

  const cancelBtn =
    document.getElementById("cancelBtn");


  let editingId = null;


  /* =========================================
     LOGIN
  ========================================== */

  loginForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      loginError.style.display = "none";

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        loginError.textContent =
          "Login failed. Check your email and password.";

        loginError.style.display =
          "block";

      }

    }
  );


  /* =========================================
     AUTH STATE
  ========================================== */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (user) {

        loginScreen.style.display =
          "none";

        dashboard.style.display =
          "block";

        adminEmail.textContent =
          user.email || "";

        await loadProducts();

      } else {

        loginScreen.style.display =
          "grid";

        dashboard.style.display =
          "none";

      }

    }
  );


  /* =========================================
     LOGOUT
  ========================================== */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );


  /* =========================================
     ADD / UPDATE
  ========================================== */

  productForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      saveBtn.disabled = true;

      const data = {

        name:
          document
            .getElementById("productName")
            .value
            .trim(),

        category:
          document
            .getElementById("category")
            .value,

        brand:
          document
            .getElementById("brand")
            .value
            .trim(),

        price:
          Number(
            document
              .getElementById("price")
              .value
          ),

        oldPrice:
          Number(
            document
              .getElementById("oldPrice")
              .value
          ) || 0,

        gender:
          document
            .getElementById("gender")
            .value,

        image:
          document
            .getElementById("image")
            .value
            .trim(),

        sizes:
          document
            .getElementById("sizes")
            .value
            .split(",")
            .map(x => x.trim())
            .filter(Boolean),

        description:
          document
            .getElementById("description")
            .value
            .trim(),

        buyLink:
          document
            .getElementById("buyLink")
            .value
            .trim(),

        updatedAt:
          serverTimestamp()

      };


      try {

        if (editingId) {

          await updateDoc(
            doc(
              db,
              "footwear",
              editingId
            ),
            data
          );

          showStatus(
            "Product updated successfully."
          );

        } else {

          data.createdAt =
            serverTimestamp();

          await addDoc(
            footwearRef,
            data
          );

          showStatus(
            "Product added successfully."
          );

        }


        resetForm();

        await loadProducts();


      } catch (error) {

        console.error(error);

        showStatus(
          "Something went wrong. Check Firestore Rules.",
          true
        );

      }


      saveBtn.disabled = false;

    }
  );


  /* =========================================
     LOAD PRODUCTS
  ========================================== */

  async function loadProducts() {

    productList.innerHTML =
      "<p>Loading products...</p>";

    try {

      const q =
        query(
          footwearRef,
          orderBy(
            "createdAt",
            "desc"
          )
        );

      const snapshot =
        await getDocs(q);


      productList.innerHTML = "";

      productCount.textContent =
        `${snapshot.size} product${snapshot.size !== 1 ? "s" : ""}`;


      if (snapshot.empty) {

        productList.innerHTML =
          "<p class='meta'>No footwear products added yet.</p>";

        return;

      }


      snapshot.forEach(
        (item) => {

          const product =
            item.data();

          const id =
            item.id;


          const div =
            document.createElement("div");

          div.className =
            "product";


          div.innerHTML = `

            <img
              src="${escapeHtml(product.image || "")}"
              alt="${escapeHtml(product.name || "Footwear")}"
              onerror="this.src='https://via.placeholder.com/200?text=Footwear'"
            >

            <div>

              <h3>
                ${escapeHtml(product.name || "Unnamed Product")}
              </h3>

              <div class="meta">
                ${escapeHtml(product.category || "")}
                •
                ${escapeHtml(product.brand || "No Brand")}
              </div>

              <div class="price">
                ₹${Number(product.price || 0).toLocaleString("en-IN")}
              </div>

            </div>

            <div class="actions">

              <button
                class="btn edit"
                data-edit="${id}"
              >
                Edit
              </button>

              <button
                class="btn delete"
                data-delete="${id}"
              >
                Delete
              </button>

            </div>
          `;


          productList.appendChild(div);

        }
      );


      document
        .querySelectorAll("[data-edit]")
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => editProduct(
                button.dataset.edit
              )
            );

          }
        );


      document
        .querySelectorAll("[data-delete]")
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => deleteProduct(
                button.dataset.delete
              )
            );

          }
        );


    } catch (error) {

      console.error(error);

      productList.innerHTML =
        "<p class='meta'>Unable to load products. Check Firestore Rules.</p>";

    }

  }


  /* =========================================
     EDIT
  ========================================== */

  async function editProduct(id) {

    try {

      const snapshot =
        await getDocs(
          collection(db, "footwear")
        );


      let found = null;

      snapshot.forEach(
        item => {

          if (item.id === id) {
            found = item.data();
          }

        }
      );


      if (!found) return;


      editingId = id;

      document
        .getElementById("productName")
        .value =
        found.name || "";


      document
        .getElementById("category")
        .value =
        found.category || "";


      document
        .getElementById("brand")
        .value =
        found.brand || "";


      document
        .getElementById("price")
        .value =
        found.price || "";


      document
        .getElementById("oldPrice")
        .value =
        found.oldPrice || "";


      document
        .getElementById("gender")
        .value =
        found.gender || "Unisex";


      document
        .getElementById("image")
        .value =
        found.image || "";


      document
        .getElementById("sizes")
        .value =
        Array.isArray(found.sizes)
          ? found.sizes.join(", ")
          : "";


      document
        .getElementById("description")
        .value =
        found.description || "";


      document
        .getElementById("buyLink")
        .value =
        found.buyLink || "";


      formTitle.textContent =
        "Edit Product";

      saveBtn.textContent =
        "Update Product";

      cancelBtn.style.display =
        "inline-block";


      window.scrollTo({
        top:0,
        behavior:"smooth"
      });


    } catch (error) {

      console.error(error);

    }

  }


  /* =========================================
     DELETE
  ========================================== */

  async function deleteProduct(id) {

    const yes =
      confirm(
        "Are you sure you want to delete this product?"
      );

    if (!yes) return;


    try {

      await deleteDoc(
        doc(
          db,
          "footwear",
          id
        )
      );


      showStatus(
        "Product deleted successfully."
      );

      await loadProducts();


    } catch (error) {

      console.error(error);

      showStatus(
        "Delete failed.",
        true
      );

    }

  }


  /* =========================================
     CANCEL EDIT
  ========================================== */

  cancelBtn.addEventListener(
    "click",
    resetForm
  );


  function resetForm() {

    editingId = null;

    productForm.reset();

    formTitle.textContent =
      "Add Product";

    saveBtn.textContent =
      "Add Product";

    cancelBtn.style.display =
      "none";

  }


  /* =========================================
     STATUS
  ========================================== */

  function showStatus(
    message,
    isError = false
  ) {

    statusBox.textContent =
      message;

    statusBox.style.display =
      "block";

    statusBox.style.background =
      isError
        ? "#fff0f1"
        : "#edf8f0";

    statusBox.style.color =
      isError
        ? "#c53f4d"
        : "#267044";


    setTimeout(
      () => {
        statusBox.style.display =
          "none";
      },
      3500
    );

  }


  /* =========================================
     SECURITY: HTML ESCAPE
  ========================================== */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
