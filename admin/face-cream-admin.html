<!DOCTYPE html>
<html lang="en-IN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>StyleEasy Face Cream Admin</title>

<style>

:root{

  --green:#174c3b;
  --dark:#0d3026;
  --sage:#769b87;
  --mint:#e8f2ed;
  --cream:#faf8f2;
  --gold:#c5a46d;
  --white:#fff;
  --text:#202723;
  --muted:#68736d;
  --border:#dfe8e2;

}

*{
  box-sizing:border-box;
}

body{

  margin:0;

  background:var(--cream);

  color:var(--text);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


/* HEADER */

header{

  background:
    linear-gradient(
      135deg,
      var(--dark),
      var(--green)
    );

  color:white;

  padding:25px 20px;

}

.header-inner{

  width:min(1200px,94%);

  margin:auto;

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.logo{

  font-family:Georgia,serif;

  font-size:28px;

  font-weight:900;

}

.logo span{
  color:#e1c88e;
}

.admin-badge{

  padding:8px 13px;

  border:1px solid rgba(255,255,255,.3);

  border-radius:20px;

  font-size:12px;

  font-weight:900;

}


/* CONTAINER */

.container{

  width:min(1200px,94%);

  margin:auto;

  padding:35px 0 60px;

}


/* FORM */

.panel{

  background:white;

  border:1px solid var(--border);

  border-radius:20px;

  padding:25px;

  box-shadow:
    0 18px 45px
    rgba(18,58,43,.09);

  margin-bottom:30px;

}

.panel h2{

  margin-top:0;

  color:var(--dark);

  font-family:Georgia,serif;

}


.form-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:15px;

}

.field{

  display:flex;

  flex-direction:column;

  gap:7px;

}

.field.full{

  grid-column:
    1/-1;

}

label{

  font-size:13px;

  font-weight:900;

  color:var(--green);

}

input,
select,
textarea{

  width:100%;

  padding:13px;

  border:1px solid var(--border);

  border-radius:10px;

  outline:none;

  font:inherit;

  background:#fff;

}

textarea{

  min-height:110px;

  resize:vertical;

}

input:focus,
select:focus,
textarea:focus{

  border-color:
    var(--sage);

  box-shadow:
    0 0 0 3px
    rgba(118,155,135,.14);

}


/* BUTTONS */

.buttons{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-top:20px;

}

button{

  border:0;

  border-radius:10px;

  padding:12px 18px;

  cursor:pointer;

  font-weight:900;

}

.primary{

  background:var(--green);

  color:white;

}

.secondary{

  background:var(--mint);

  color:var(--green);

}

.cancel{

  background:#eee;

  color:#333;

}

.delete{

  background:#9c263d;

  color:white;

}

.edit{

  background:var(--gold);

  color:#292015;

}


/* STATUS */

#status{

  margin-top:15px;

  padding:12px;

  border-radius:10px;

  display:none;

  font-weight:800;

}

.success{

  display:block !important;

  background:#e6f5ec;

  color:#16643e;

}

.error{

  display:block !important;

  background:#fde7e9;

  color:#8c2030;

}


/* PRODUCTS */

.product-list{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;

}

.product{

  overflow:hidden;

  background:white;

  border:1px solid var(--border);

  border-radius:17px;

  box-shadow:
    0 12px 30px
    rgba(18,58,43,.08);

}

.product img{

  width:100%;

  aspect-ratio:4/2.8;

  object-fit:cover;

  object-position:center top;

}

.product-body{

  padding:15px;

}

.product-body h3{

  margin:5px 0;

}

.meta{

  color:var(--muted);

  font-size:12px;

  line-height:1.7;

}

.product-actions{

  display:flex;

  gap:8px;

  margin-top:12px;

}

.product-actions button{

  flex:1;

}


/* MOBILE */

@media(max-width:850px){

  .product-list{

    grid-template-columns:
      repeat(2,1fr);

  }

}

@media(max-width:650px){

  .form-grid{

    grid-template-columns:1fr;

  }

  .field.full{

    grid-column:auto;

  }

  .product-list{

    grid-template-columns:1fr;

  }

  .header-inner{

    gap:10px;

    align-items:flex-start;

    flex-direction:column;

  }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

  <div class="logo">
    Style<span>Easy</span>
  </div>

  <div class="admin-badge">
    FACE CREAM ADMIN
  </div>

</div>

</header>


<main class="container">


<section class="panel">

<h2 id="formTitle">
  Add Face Cream Product
</h2>


<form id="productForm">


<div class="form-grid">


<div class="field">

<label>
Product Name
</label>

<input
  id="name"
  required
  placeholder="e.g. Hydrating Face Cream"
>

</div>


<div class="field">

<label>
Brand
</label>

<input
  id="brand"
  placeholder="e.g. Style Beauty"
>

</div>


<div class="field">

<label>
Price ₹
</label>

<input
  id="price"
  type="number"
  min="0"
  required
  placeholder="499"
>

</div>


<div class="field">

<label>
Old Price ₹
</label>

<input
  id="oldPrice"
  type="number"
  min="0"
  placeholder="699"
>

</div>


<div class="field">

<label>
Category
</label>

<select id="category">

<option value="Moisturizer">
Moisturizer
</option>

<option value="Day Cream">
Day Cream
</option>

<option value="Night Cream">
Night Cream
</option>

<option value="SPF Cream">
SPF Cream
</option>

<option value="Brightening">
Brightening
</option>

<option value="Hydrating">
Hydrating
</option>

<option value="Anti-Aging">
Anti-Aging
</option>

<option value="Acne Care">
Acne Care
</option>

<option value="Vitamin C">
Vitamin C
</option>

<option value="Aloe Vera">
Aloe Vera
</option>

</select>

</div>


<div class="field">

<label>
Skin Type
</label>

<select id="skinType">

<option value="Normal">
Normal
</option>

<option value="Oily">
Oily
</option>

<option value="Dry">
Dry
</option>

<option value="Combination">
Combination
</option>

<option value="Sensitive">
Sensitive
</option>

</select>

</div>


<div class="field">

<label>
Size
</label>

<input
  id="size"
  placeholder="e.g. 50 g"
>

</div>


<div class="field">

<label>
Image URL
</label>

<input
  id="image"
  type="url"
  required
  placeholder="https://..."
>

</div>


<div class="field full">

<label>
Buy / SFF Link
</label>

<input
  id="buyLink"
  type="url"
  placeholder="https://..."
>

</div>


<div class="field full">

<label>
Product Description
</label>

<textarea
  id="description"
  placeholder="Short product description..."
></textarea>

</div>


</div>


<div class="buttons">

<button
  class="primary"
  type="submit"
  id="saveButton"
>
  Add Product
</button>

<button
  class="cancel"
  type="button"
  id="cancelButton"
  style="display:none"
>
  Cancel Edit
</button>

</div>


<div id="status"></div>


</form>

</section>



<section class="panel">

<h2>
  Face Cream Products
</h2>

<div
  id="productList"
  class="product-list"
>

  <p>
    Loading products...
  </p>

</div>

</section>


</main>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDKVwHm3-RO3IkycB8VdwizUYQLgasGqzk",

  authDomain:
    "lucky-triode-450317-g7.firebaseapp.com",

  databaseURL:
    "https://lucky-triode-450317-g7-default-rtdb.firebaseio.com",

  projectId:
    "lucky-triode-450317-g7",

  storageBucket:
    "lucky-triode-450317-g7.firebasestorage.app",

  messagingSenderId:
    "778199870672",

  appId:
    "1:778199870672:web:62a9891e41b3a3d3f242d5",

  measurementId:
    "G-BD8Y4KXCKM"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


/*
========================================================
ONLY THIS COLLECTION
========================================================
*/

const productsRef =
  collection(
    db,
    "faceCream"
  );


let editingId = null;


const form =
  document.getElementById(
    "productForm"
  );


const productList =
  document.getElementById(
    "productList"
  );


const status =
  document.getElementById(
    "status"
  );


const saveButton =
  document.getElementById(
    "saveButton"
  );


const cancelButton =
  document.getElementById(
    "cancelButton"
  );


const formTitle =
  document.getElementById(
    "formTitle"
  );


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showStatus(
  message,
  type="success"
){

  status.textContent =
    message;

  status.className =
    type;

}


function getFormData(){

  return {

    name:
      document.getElementById(
        "name"
      ).value.trim(),

    brand:
      document.getElementById(
        "brand"
      ).value.trim(),

    price:
      Number(
        document.getElementById(
          "price"
        ).value
      ),

    oldPrice:
      Number(
        document.getElementById(
          "oldPrice"
        ).value
      ),

    category:
      document.getElementById(
        "category"
      ).value,

    skinType:
      document.getElementById(
        "skinType"
      ).value,

    size:
      document.getElementById(
        "size"
      ).value.trim(),

    image:
      document.getElementById(
        "image"
      ).value.trim(),

    buyLink:
      document.getElementById(
        "buyLink"
      ).value.trim(),

    description:
      document.getElementById(
        "description"
      ).value.trim(),

    updatedAt:
      serverTimestamp()

  };

}


/* ADD / UPDATE */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    try{

      const data =
        getFormData();


      if(editingId){

        await updateDoc(
          doc(
            db,
            "faceCream",
            editingId
          ),
          data
        );

        showStatus(
          "Face Cream product updated successfully."
        );

      }
      else{

        await addDoc(
          productsRef,
          {
            ...data,
            createdAt:
              serverTimestamp()
          }
        );

        showStatus(
          "Face Cream product added successfully."
        );

      }


      resetForm();

      loadProducts();

    }
    catch(error){

      console.error(error);

      showStatus(
        "Error: " +
        error.message,
        "error"
      );

    }

  }
);


/* LOAD */

async function loadProducts(){

  try{

    const snapshot =
      await getDocs(
        productsRef
      );

    productList.innerHTML = "";


    if(snapshot.empty){

      productList.innerHTML = `

        <p>
          No Face Cream products added yet.
        </p>

      `;

      return;

    }


    snapshot.forEach(
      item => {

        const product =
          item.data();


        const card =
          document.createElement(
            "article"
          );

        card.className =
          "product";


        card.innerHTML = `

          <img
            src="${escapeHTML(
              product.image
            )}"
            alt="${escapeHTML(
              product.name ||
              "Face Cream"
            )}"
            loading="lazy"
          >


          <div class="product-body">

            <h3>
              ${escapeHTML(
                product.name
              )}
            </h3>

            <div class="meta">

              <strong>
                Brand:
              </strong>
              ${escapeHTML(
                product.brand
              )}

              <br>

              <strong>
                Category:
              </strong>
              ${escapeHTML(
                product.category
              )}

              <br>

              <strong>
                Skin:
              </strong>
              ${escapeHTML(
                product.skinType
              )}

              <br>

              <strong>
                Price:
              </strong>
              ₹${Number(
                product.price || 0
              ).toLocaleString("en-IN")}

            </div>


            <div class="product-actions">

              <button
                class="edit"
                data-edit="${item.id}"
              >
                Edit
              </button>

              <button
                class="delete"
                data-delete="${item.id}"
              >
                Delete
              </button>

            </div>

          </div>

        `;


        productList.appendChild(
          card
        );


        card
          .querySelector(
            "[data-edit]"
          )
          .addEventListener(
            "click",
            () =>
              editProduct(
                item.id,
                product
              )
          );


        card
          .querySelector(
            "[data-delete]"
          )
          .addEventListener(
            "click",
            () =>
              deleteProduct(
                item.id
              )
          );

      }
    );

  }
  catch(error){

    console.error(error);

    productList.innerHTML = `

      <p>
        Firebase error:
        ${escapeHTML(
          error.message
        )}
      </p>

    `;

  }

}


/* EDIT */

function editProduct(
  id,
  product
){

  editingId = id;


  document.getElementById(
    "name"
  ).value =
    product.name || "";


  document.getElementById(
    "brand"
  ).value =
    product.brand || "";


  document.getElementById(
    "price"
  ).value =
    product.price || "";


  document.getElementById(
    "oldPrice"
  ).value =
    product.oldPrice || "";


  document.getElementById(
    "category"
  ).value =
    product.category ||
    "Moisturizer";


  document.getElementById(
    "skinType"
  ).value =
    product.skinType ||
    "Normal";


  document.getElementById(
    "size"
  ).value =
    product.size || "";


  document.getElementById(
    "image"
  ).value =
    product.image || "";


  document.getElementById(
    "buyLink"
  ).value =
    product.buyLink || "";


  document.getElementById(
    "description"
  ).value =
    product.description || "";


  formTitle.textContent =
    "Edit Face Cream Product";


  saveButton.textContent =
    "Update Product";


  cancelButton.style.display =
    "inline-block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* DELETE */

async function deleteProduct(
  id
){

  const ok =
    confirm(
      "Delete this Face Cream product?"
    );


  if(!ok) return;


  try{

    await deleteDoc(
      doc(
        db,
        "faceCream",
        id
      )
    );


    showStatus(
      "Product deleted successfully."
    );


    loadProducts();

  }
  catch(error){

    console.error(error);

    showStatus(
      "Delete error: " +
      error.message,
      "error"
    );

  }

}


/* RESET */

function resetForm(){

  form.reset();

  editingId = null;

  formTitle.textContent =
    "Add Face Cream Product";

  saveButton.textContent =
    "Add Product";

  cancelButton.style.display =
    "none";

}


cancelButton.addEventListener(
  "click",
  resetForm
);


loadProducts();

</script>

</body>
</html>
