    <style>

            --primary-color: #070588;

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--light-bg); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; }

        /* DESKTOP SEARCH BAR */
        .search-container { position: relative; display: flex; align-items: center; background: #222; border: 1px solid #444; border-radius: 25px; padding: 6px 18px; width: 300px; transition: all 0.3s ease; }
        .search-container:focus-within { border-color: var(--accent-color); box-shadow: 0 0 8px rgba(197, 168, 128, 0.3); }

        .page-title-bar h1 { font-size: 40px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
        .page-title-bar p { font-size: 16px; color: #dddddd; letter-spacing: 0.5px; }

        /* MAIN CONTENT & GRID */
        main { flex: 1; max-width: 1200px; width: 100%; margin: 40px auto; padding: 0 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        
        /* PRODUCT CARD */
        .product-card { background-color: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.04); transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s; display: flex; flex-direction: column; border: 1px solid #eee; }

        .product-img-container { width: 100%; height: 340px; overflow: hidden; background-color: #f5f5f5; position: relative; }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .product-card:hover .product-img { transform: scale(1.06); }
        
        .product-info { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--primary-color); line-height: 1.3; }
        .product-desc { font-size: 13.5px; color: #666; margin-bottom: 20px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; gap: 10px; }

    <!-- HIGH-PERFORMANCE CLOUD DATA ENGINE -->
    <script>
        // 1. Live Database Link Configured Correctly
        const firebaseConfig = {
            apiKey: "AIzaSyDKVwHm3-RO3IkycB8VdwizUYQLgasGqzk",
            authDomain: "lucky-triode-450317-g7.firebaseapp.com",
            databaseURL: "https://lucky-triode-450317-g7-default-rtdb.firebaseio.com/", 
            projectId: "lucky-triode-450317-g7",
            storageBucket: "lucky-triode-450317-g7.firebasestorage.app",
            messagingSenderId: "778199870672",
            appId: "1:778199870672:web:62a9891e41b3a3d3f242d5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let mensProducts = [];

        // 2. Fetch Isolated Men's Wear Data Stream
        function syncMensCloudStore() {
            // 👇 Targeted Node Path prevents data cross-matching
            database.ref('products/menswear').on('value', (snapshot) => {
                mensProducts = [];
                const cloudData = snapshot.val();
                
                if (cloudData) {
                    Object.keys(cloudData).forEach(key => {
                        mensProducts.push(cloudData[key]);
                    });
                }
                renderProducts(mensProducts);
            }, (error) => {
                console.error("Firebase Sync Failure:", error);
            });
        }

        // 3. Render HTML UI Cards safely
        function renderProducts(productsList) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            if (productsList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search" style="font-size:35px; color:#bbb; display:block; margin-bottom:12px;"></i>
                        <p>No products match your search. New designs arriving soon.</p>
                    </div>`;
                return;
            }

            productsList.forEach((product) => {
                const targetLink = product.buyLink || '#';
                const title = escapeHTML(product.title || 'Premium Men Apparel');
                const desc = escapeHTML(product.description || 'Exclusive local design crafted with high-grade fabric.');
                const price = escapeHTML(product.price || '0');
                const img = product.imageUrl || 'https://images.unsplash.com/photo-1490578474895-699cd4e2cf59?auto=format&fit=crop&w=400&q=80';

                const cardHTML = `
                    <article class="product-card">
                        <div class="product-img-container">
                            <img src="${img}" alt="Buy ${title} online" class="product-img" loading="lazy">
                        </div>
                        <div class="product-info">
                            <h2 class="product-title">${title}</h2>
                            <p class="product-desc">${desc}</p>
                            <div class="product-price-row">
                                <span class="product-price">₹${price}</span>
                                <a href="${targetLink}" target="_blank" rel="noopener" class="add-to-cart-btn">
                                    <i class="fas fa-shopping-bag"></i> Buy Now
                                </a>
                            </div>
                        </div>
                    </article>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // XSS Script Safety Engine
        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // 4. Keyboard Real-time Search Controller
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            const filteredProducts = mensProducts.filter(product => {
                const titleMatch = product.title ? product.title.toLowerCase().includes(searchTerm) : false;
                const descMatch = product.description ? product.description.toLowerCase().includes(searchTerm) : false;
                return titleMatch || descMatch;
            });

            renderProducts(filteredProducts);
        });

        // Safe Initialization
        window.addEventListener('DOMContentLoaded', syncMensCloudStore);
    </script>
</body>
