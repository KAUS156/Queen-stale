<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen Style | Admin Panel</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231e3a8a'/%3E%3Ctext x='50' y='67' font-size='50' text-anchor='middle' fill='%23d4af37'%3EQ%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
        }
        .admin-container { display: flex; min-height: 100vh; }
        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar-header { text-align: center; padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        .sidebar-header h2 { font-size: 1.8rem; background: linear-gradient(135deg, #d4af37, #fbbf24); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .sidebar-header p { color: #94a3b8; font-size: 0.8rem; margin-top: 8px; }
        .nav-item {
            padding: 12px 20px;
            margin: 8px 0;
            color: #cbd5e1;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-item:hover, .nav-item.active { background: linear-gradient(135deg, #1e3a8a, #7c3aed); color: white; }
        .main-content { flex: 1; padding: 30px 40px; overflow-y: auto; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 15px;
        }
        .page-title h1 { color: white; font-size: 1.8rem; }
        .page-title p { color: #94a3b8; font-size: 0.85rem; margin-top: 5px; }
        .admin-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 50px;
        }
        .admin-avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #d4af37, #fbbf24);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #1e1b4b;
        }
        .admin-details { color: white; }
        .admin-details .name { font-weight: 600; }
        .admin-details .email { font-size: 0.75rem; color: #94a3b8; }
        .logout-btn {
            background: rgba(220,38,38,0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .logout-btn:hover { background: #ef4444; color: white; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 20px; border-radius: 20px; }
        .stat-card h3 { color: #94a3b8; font-size: 0.8rem; margin-bottom: 10px; }
        .stat-number { font-size: 2rem; font-weight: bold; color: #d4af37; }
        .users-section { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 25px; margin-top: 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .section-header h3 { color: white; font-size: 1.3rem; }
        .refresh-btn { background: rgba(255,255,255,0.1); border: none; padding: 8px 16px; border-radius: 8px; color: white; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; color: #cbd5e1; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #d4af37; }
        .admin-badge { background: linear-gradient(135deg, #d4af37, #fbbf24); color: #1e1b4b; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; }
        .user-badge { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; }
        .empty-state { text-align: center; padding: 40px; color: #64748b; }
        @media (max-width: 768px) { .sidebar { width: 80px; padding: 20px 10px; } .sidebar-header h2, .nav-item span:not(.nav-icon) { display: none; } .nav-item { justify-content: center; } .main-content { padding: 20px; } }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="sidebar">
        <div class="sidebar-header"><h2>QUEEN</h2><p>Admin Panel</p></div>
        <div class="nav-item active"><span class="nav-icon">📊</span><span>Dashboard</span></div>
        <div class="nav-item" onclick="location.href='orders.html'"><span class="nav-icon">🛍️</span><span>Orders</span></div>
        <div class="nav-item"><span class="nav-icon">⚙️</span><span>Settings</span></div>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <div class="page-title"><h1>Dashboard</h1><p>Welcome to your royal command center</p></div>
            <div class="admin-info"><div class="admin-avatar" id="adminAvatar">A</div><div class="admin-details"><div class="name" id="adminName">Administrator</div><div class="email" id="adminEmail">admin@queenstyle.com</div></div><button class="logout-btn" onclick="logout()">Logout</button></div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><h3>Total Users</h3><div class="stat-number" id="totalUsers">0</div></div>
            <div class="stat-card"><h3>Total Orders</h3><div class="stat-number" id="totalOrders">0</div></div>
            <div class="stat-card"><h3>Revenue</h3><div class="stat-number" id="totalRevenue">$0</div></div>
        </div>
        <div class="users-section">
            <div class="section-header"><h3>👑 Registered Users</h3><button class="refresh-btn" onclick="loadUsers()">⟳ Refresh</button></div>
            <div class="users-table"><div id="usersList"><div class="empty-state">Loading users...</div></div></div>
        </div>
    </div>
</div>

<script>
    const ADMIN_EMAIL = "admin@queenstyle.com";
    
    function loadUsers() {
        const registeredUsers = JSON.parse(localStorage.getItem("registeredUsers") || "[]");
        const container = document.getElementById("usersList");
        document.getElementById("totalUsers").textContent = registeredUsers.length;
        
        // Demo orders count
        const orders = JSON.parse(localStorage.getItem("queen_orders") || "[]");
        document.getElementById("totalOrders").textContent = orders.length;
        const revenue = orders.filter(o => o.status === "delivered").reduce((sum, o) => sum + (o.amount || 0), 0);
        document.getElementById("totalRevenue").textContent = `$${revenue.toFixed(2)}`;
        
        if (registeredUsers.length === 0) {
            container.innerHTML = '<div class="empty-state">👑 No users registered yet. Users will appear here after registration.</div>';
            return;
        }
        
        let html = `<table><thead><tr><th>Name</th><th>Email</th><th>Area</th><th>Role</th><th>Registered On</th></tr></thead><tbody>`;
        registeredUsers.forEach(user => {
            const isAdminUser = user.email === ADMIN_EMAIL;
            html += `<tr><td>${escapeHtml(user.name)}</td><td>${escapeHtml(user.email)}</td><td>${escapeHtml(user.area || 'N/A')}</td><td>${isAdminUser ? '<span class="admin-badge">Admin</span>' : '<span class="user-badge">User</span>'}</td><td>${new Date(user.registeredAt).toLocaleDateString()}</td></tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
    }
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    
    function loadAdminInfo() {
        const user = JSON.parse(localStorage.getItem("currentUser") || "{}");
        document.getElementById("adminName").textContent = user.name || "Administrator";
        document.getElementById("adminEmail").textContent = user.email || ADMIN_EMAIL;
        document.getElementById("adminAvatar").textContent = (user.name || "A").charAt(0).toUpperCase();
    }
    
    function logout() {
        localStorage.removeItem("isAdmin");
        localStorage.removeItem("currentUser");
        window.location.href = "login.html";
    }
    
    function checkAdmin() {
        const isAdmin = localStorage.getItem("isAdmin");
        if (isAdmin !== "true") {
            window.location.href = "login.html";
            return false;
        }
        return true;
    }
    
    if (checkAdmin()) {
        loadAdminInfo();
        loadUsers();
    }
</script>
</body>
</html>
